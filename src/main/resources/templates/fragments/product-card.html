<div xmlns:th="http://www.thymeleaf.org">

<!--
  Fragment card sản phẩm dùng chung cho home.html và products.html.
  Cách dùng: th:replace="~{fragments/product-card :: card(product=${product})}"
-->
<div th:fragment="card(product)" class="card h-100 product-card border rounded-3 p-2 hover-shadow">
    <span class="badge bg-danger position-absolute top-0 start-0 m-2" th:if="${product.status.name() == 'ACTIVE'}">HOT</span>

    <img th:src="${product.images != null and !product.images.isEmpty() ? product.images[0].imageUrl : '/images/placeholder.jpg'}"
         class="card-img-top rounded p-2 product-img"
         th:alt="${product.name}"
         style="object-fit: cover; height: 200px;">

    <div class="card-body p-2 d-flex flex-column justify-content-between">
        <div>
            <span class="text-muted fs-8" th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}">Danh mục</span>
            <h6 class="card-title fw-bold fs-7 text-dark text-truncate-2 mt-1" th:text="${product.name}">Tên sản phẩm</h6>
        </div>
        <div class="mt-3">
            <div class="d-flex align-items-center gap-2">
                <span class="text-danger fw-bold fs-6" th:text="${#numbers.formatDecimal(product.basePrice, 0, 'COMMA', 0, 'POINT')} + 'đ'">Giá</span>
            </div>
            <button type="button" class="btn btn-outline-danger btn-sm w-100 mt-2 fw-semibold add-to-cart-btn"
                    th:data-product-id="${product.productId}"
                    th:data-product-name="${product.name}"
                    th:data-product-price="${product.basePrice}"
                    th:data-product-image="${product.images != null and !product.images.isEmpty() ? product.images[0].imageUrl : '/images/placeholder.jpg'}">
                <i class="bi bi-cart-plus me-1"></i> Thêm Giỏ Hàng
            </button>
        </div>
    </div>
</div>

</div>
