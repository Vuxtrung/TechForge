<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="admin-sidebar bg-dark text-white d-flex flex-column flex-shrink-0 p-3" style="width: 280px; min-height: calc(100vh - 72px);">
    <a th:href="@{/admin/products}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom border-secondary pb-3 w-100">
        <span class="fs-5 fw-bold"><i class="bi bi-speedometer2 text-danger me-2"></i>Dashboard</span>
    </a>
    <ul class="nav nav-pills flex-column mb-auto mt-3">
        
        <li class="nav-item mb-2">
            <a th:href="@{/admin/users(tab='staff')}" class="nav-link text-white d-flex align-items-center hover-bg-secondary">
                <i class="bi bi-people me-2 fs-5"></i>
                Quản lý người dùng
            </a>
        </li>
        
        <li class="nav-item mb-2">
            <a class="nav-link text-white d-flex align-items-center hover-bg-secondary" data-bs-toggle="collapse" href="#productCollapse" role="button" aria-expanded="false" aria-controls="productCollapse">
                <i class="bi bi-box-seam me-2 fs-5"></i>
                Quản lý sản phẩm
                <i class="bi bi-chevron-down ms-auto fs-8"></i>
            </a>
            <div class="collapse show ms-3 mt-1" id="productCollapse">
                <ul class="btn-toggle-nav list-unstyled fw-normal pb-1 small">
                    <li class="mb-1"><a th:href="@{/admin/products}" class="nav-link text-white hover-text-danger"><i class="bi bi-dot"></i> Danh sách Sản phẩm</a></li>
                    <li class="mb-1"><a th:href="@{/admin/categories}" class="nav-link text-white hover-text-danger"><i class="bi bi-dot"></i> Quản lý Danh mục</a></li>
                </ul>
            </div>
        </li>
        

        <li class="nav-item mb-2">
            <a th:href="@{/admin/vouchers}" class="nav-link text-white d-flex align-items-center hover-bg-secondary">
                <i class="bi bi-ticket-perforated me-2 fs-5"></i>
                Voucher
            </a>
        </li>
        
        <li class="nav-item mb-2">
            <a th:href="@{/admin/reviews}" class="nav-link text-white d-flex align-items-center hover-bg-secondary">
                <i class="bi bi-star-half me-2 fs-5"></i>
                Quản lý Đánh giá
            </a>
        </li>
        <li class="nav-item mb-2">
            <a th:href="@{/admin/blogs}" class="nav-link text-white d-flex align-items-center hover-bg-secondary">
                <i class="bi bi-newspaper me-2 fs-5"></i>
                Quản lý Blog & Tin tức
            </a>
        </li>
        
    </ul>
    <style>
        .hover-bg-secondary:hover {
            background-color: #343a40 !important;
            border-radius: 6px;
        }
        .hover-text-danger:hover {
            color: #dc3545 !important;
        }
    </style>
    <hr class="border-secondary mt-auto mb-3 w-100">
    <div class="d-flex align-items-center w-100 pb-2 justify-content-between">
        <a th:href="@{/account}" class="d-flex align-items-center text-white text-decoration-none" title="Hồ sơ của tôi">
            <i class="bi bi-person-circle fs-4 me-2 text-warning"></i>
            <strong th:text="${#authentication.name}">Admin</strong>
        </a>
        <form th:action="@{/logout}" method="post" class="m-0 p-0">
            <button type="submit" class="btn btn-link text-danger p-0 border-0" title="Đăng xuất">
                <i class="bi bi-box-arrow-right fs-4"></i>
            </button>
        </form>
    </div>
</div>
</body>
</html>
