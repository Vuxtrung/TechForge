<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Lịch Sử Đơn Hàng - TechForge</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body container-fluid px-lg-5 my-4">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb fs-7">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none text-muted">Trang chủ</a></li>
                <li class="breadcrumb-item active text-danger fw-semibold" aria-current="page">Lịch sử đơn hàng</li>
            </ol>
        </nav>

        <h4 class="fw-bold text-dark mb-4"><i class="bi bi-journal-text text-danger me-2"></i> LỊCH SỬ ĐƠN HÀNG CỦA BẠN</h4>

        <!-- THANH BỘ LỌC ĐƠN HÀNG (4 FILTER FIELDS: Từ ngày, Đến ngày, Trạng thái, Tìm kiếm) -->
        <div class="bg-white rounded-3 shadow-sm border p-3 mb-4">
            <form th:action="@{/orders}" method="get" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label for="startDate" class="form-label fs-7 fw-semibold text-muted">Từ ngày đặt</label>
                    <input type="date" class="form-control form-control-sm" id="startDate" name="startDate" th:value="${startDate}">
                </div>

                <div class="col-md-3">
                    <label for="endDate" class="form-label fs-7 fw-semibold text-muted">Đến ngày đặt</label>
                    <input type="date" class="form-control form-control-sm" id="endDate" name="endDate" th:value="${endDate}">
                </div>

                <div class="col-md-3">
                    <label for="status" class="form-label fs-7 fw-semibold text-muted">Trạng thái đơn hàng</label>
                    <select class="form-select form-select-sm" id="status" name="status">
                        <option value="" th:selected="${selectedStatus == null || selectedStatus == ''}">-- Tất cả trạng thái --</option>
                        <option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ xử lý (Pending)</option>
                        <option value="CONFIRMED" th:selected="${selectedStatus == 'CONFIRMED'}">Đã xác nhận (Confirmed)</option>
                        <option value="SHIPPING" th:selected="${selectedStatus == 'SHIPPING'}">Đang giao hàng (Shipping)</option>
                        <option value="DELIVERED" th:selected="${selectedStatus == 'DELIVERED'}">Giao thành công (Delivered)</option>
                        <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã hủy (Cancelled)</option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <div class="flex-grow-1">
                        <label for="search" class="form-label fs-7 fw-semibold text-muted">Tìm theo Mã / Người nhận</label>
                        <input type="text" class="form-control form-control-sm" id="search" name="search" th:value="${search}" placeholder="Mã đơn / Tên...">
                    </div>
                    <button type="submit" class="btn btn-danger btn-sm px-3 fw-bold align-self-end">Lọc</button>
                    <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm px-2 fw-bold align-self-end">Reset</a>
                </div>
            </form>
        </div>

        <!-- DANH SÁCH ĐƠN HÀNG -->
        <div class="bg-white rounded-3 shadow-sm border p-3">
            <div class="table-responsive">
                <table class="table align-middle table-hover mb-0 fs-7">
                    <thead class="table-light text-secondary">
                        <tr>
                            <th scope="col">Mã Đơn</th>
                            <th scope="col">Ngày Đặt</th>
                            <th scope="col">Người Nhận</th>
                            <th scope="col" class="text-center">Thanh Toán</th>
                            <th scope="col" class="text-center">Trạng Thái</th>
                            <th scope="col" class="text-end">Tổng Tiền</th>
                            <th scope="col" class="text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="order : ${orders}">
                            <td><strong class="text-danger" th:text="'#' + ${order.orderId}">#1001</strong></td>
                            <td th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}">16/08/2026 10:30</td>
                            <td>
                                <strong class="text-dark" th:text="${order.recipientName}">Nguyễn Văn A</strong>
                                <div class="fs-8 text-muted" th:text="${order.phone}">0988888888</div>
                            </td>
                            <td class="text-center">
                                <span class="badge bg-secondary fs-8" th:text="${order.payment != null ? order.payment.method : 'COD'}">COD</span>
                            </td>
                            <td class="text-center">
                                <span th:if="${order.status.name() == 'PENDING'}" class="badge bg-warning text-dark fs-8">Chờ xử lý</span>
                                <span th:if="${order.status.name() == 'CONFIRMED'}" class="badge bg-info text-white fs-8">Đã xác nhận</span>
                                <span th:if="${order.status.name() == 'SHIPPING'}" class="badge bg-primary fs-8">Đang giao hàng</span>
                                <span th:if="${order.status.name() == 'DELIVERED'}" class="badge bg-success fs-8">Giao thành công</span>
                                <span th:if="${order.status.name() == 'CANCELLED'}" class="badge bg-danger fs-8">Đã hủy</span>
                            </td>
                            <td class="text-end fw-bold text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                                18.020.000đ
                            </td>
                            <td class="text-center">
                                <a th:href="@{'/orders/' + ${order.orderId}}" class="btn btn-outline-danger btn-sm px-2 py-0 fs-8 fw-semibold">
                                    <i class="bi bi-eye"></i> Chi tiết
                                </a>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(orders)}">
                            <td colspan="7" class="text-center py-5">
                                <i class="bi bi-box-seam text-muted display-4"></i>
                                <p class="text-muted mt-2 fs-7">Chưa tìm thấy đơn hàng nào!</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
