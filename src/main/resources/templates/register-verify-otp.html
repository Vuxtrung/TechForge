<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Xác thực OTP đăng ký - TechForge</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="bg-white rounded-3 shadow-sm border p-4" style="max-width: 420px; width: 100%;">
        <h5 class="fw-bold text-dark mb-1">Xác thực đăng ký</h5>
        <p class="text-muted fs-7 mb-4">
            Mã OTP đã được gửi đến <strong th:text="${maskedEmail}"></strong>. Có hiệu lực trong 5 phút.
        </p>

        <div th:if="${successMessage}" class="alert alert-success py-2 fs-8" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger py-2 fs-8" th:text="${errorMessage}"></div>

        <form th:action="@{/register/verify}" th:object="${verifyOtpRequest}" method="post" novalidate>
            <input type="hidden" th:field="*{email}">
            <div class="mb-3">
                <label class="form-label fs-7 fw-semibold">Mã OTP</label>
                <input type="text" th:field="*{otpCode}" class="form-control text-center fs-4"
                       th:classappend="${#fields.hasErrors('otpCode')} ? 'is-invalid'"
                       maxlength="6" inputmode="numeric" placeholder="------" autofocus>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
            </div>
            <button type="submit" class="btn btn-danger w-100 mb-2">Xác nhận</button>
        </form>

        <form th:action="@{/register/resend}" method="post" class="text-center">
            <button type="submit" class="btn btn-link fs-8 text-decoration-none">
                Chưa nhận được mã? Gửi lại OTP
            </button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
