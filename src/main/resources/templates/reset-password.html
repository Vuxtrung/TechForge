<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - TechForge</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="bg-white rounded-3 shadow-sm border p-4" style="max-width: 420px; width: 100%;">
        <h5 class="fw-bold text-dark mb-1">Đặt lại mật khẩu</h5>
        <p class="text-muted fs-7 mb-4">Nhập mật khẩu mới cho tài khoản của bạn.</p>

        <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label fs-7 fw-semibold">Mật khẩu mới</label>
                <input type="password" th:field="*{newPassword}" class="form-control"
                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fs-7 fw-semibold">Xác nhận mật khẩu</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-danger w-100">Đặt lại mật khẩu</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
