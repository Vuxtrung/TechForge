<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Đăng ký - TechForge</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- Register -->
    <main class="login-page">
        <div class="register-container">
            <section class="register-form-box">
                <h1>Tạo tài khoản khách hàng cá nhân</h1>
                <form th:action="@{/register}" method="post" class="register-form">
                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Email đăng ký<span class="required">*</span>
                        </label>
                        <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
                    </div>
                    <!-- Name -->
                    <div class="form-group">
                        <label for="name">
                            Tên<span class="required">*</span>
                        </label>
                        <input type="text" id="name" name="name" placeholder="Nhập tên của bạn" required>
                    </div>
                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">
                            Số di động<span class="required">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone" placeholder="Nhập số điện thoại" required>
                    </div>
                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">
                            Mật khẩu<span class="required">*</span>
                        </label>
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <!-- Confirm password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Nhập lại mật khẩu<span class="required">*</span>
                        </label>

                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Nhập lại mật khẩu" required>

                    </div>
                    <!-- Address -->
                    <div class="form-group">
                        <label for="address"> Địa chỉ </label>
                        <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ của bạn"></textarea>
                    </div>
                    <!-- Submit -->
                    <button type="submit" class="register-button register-submit">
                        Đăng ký
                    </button>
                </form>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
