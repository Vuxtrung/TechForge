<style>
        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
        }
        .glass-panel {
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-glow:hover {
            box-shadow: 0 0 40px rgba(0, 209, 255, 0.15);
        }
        .input-glow:focus-within {
            border-bottom-color: #00D1FF;
        }
        
        /* Checkbox switch styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #00D1FF;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #00D1FF;
        }
    </style>

<body class="min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-[url('placeholder')] bg-cover bg-center" data-alt="A macro shot of high-end PC hardware components, specifically a motherboard with sleek dark grey and black heat sinks. Subtle neon blue LEDs provide a sharp, technical illumination. The background is deeply shadowed, focusing entirely on the precision engineering of the tech. The overall aesthetic is aggressive, premium, and cybernetic, fitting a high-performance computing theme.">
<!-- Background overlay for depth -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-0"></div>
<main class="relative z-10 w-full max-w-md glass-panel p-8 rounded-xl shadow-[0_0_80px_rgba(0,0,0,0.8)]">
<div class="text-center mb-10">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary tracking-tighter mb-2">TechForge</h1>
<p class="font-body-md text-body-md text-on-surface-variant">ENGINEERED FOR POWER.</p>
</div>
<form class="space-y-6">
<div class="space-y-1 group input-glow border-b border-surface-variant transition-colors duration-300 pb-2">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest" for="fullName">Full Name</label>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant p-0" id="fullName" placeholder="J. Doe" type="text"/>
</div>
<div class="space-y-1 group input-glow border-b border-surface-variant transition-colors duration-300 pb-2">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest" for="email">Email</label>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant p-0" id="email" placeholder="operator@neon.com" type="email"/>
</div>
<div class="space-y-1 group input-glow border-b border-surface-variant transition-colors duration-300 pb-2">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<div class="relative flex items-center">
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant p-0 pr-8" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-0 text-on-surface-variant text-sm cursor-pointer hover:text-primary transition-colors">visibility</span>
</div>
</div>
<div class="space-y-1 group input-glow border-b border-surface-variant transition-colors duration-300 pb-2">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-widest" for="confirmPassword">Confirm Password</label>
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant p-0" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center justify-between pt-4">
<span class="font-body-md text-body-md text-on-surface-variant">Subscribe to Hardware Updates</span>
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer border-surface-variant transition-all duration-300 z-10 top-0 left-0" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer transition-colors duration-300" for="toggle"></label>
</div>
</div>
<button class="w-full bg-primary text-black font-headline-md text-[20px] font-bold py-4 rounded-lg neon-glow transition-all duration-300 hover:bg-primary-container active:scale-[0.98] mt-8 flex justify-center items-center gap-2" type="button">
                SIGN UP
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center border-t border-white/5 pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already an operator? 
                <a class="text-primary hover:text-primary-container hover:underline transition-colors ml-1 font-bold" href="/login">Back to Login</a>
</p>
</div>
</main>
</body></html>
