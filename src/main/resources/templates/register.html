<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Đăng ký - TechForge</title>
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Register -->
    <main class="login-page">
        <div class="register-container">

            <section class="register-form-box">

                <h1>Tạo tài khoản khách hàng cá nhân</h1>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="register-form">

                    <!-- General error -->
                    <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}">
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Email đăng ký<span class="required">*</span>
                        </label>

                        <input type="email" id="email" th:field="*{email}" placeholder="Nhập email của bạn" required>
                    </div>

                    <!-- Name -->
                    <div class="form-group">
                        <label for="fullName">
                            Tên<span class="required">*</span>
                        </label>

                        <input type="text" id="fullName" th:field="*{fullName}" placeholder="Nhập tên của bạn" required>
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">
                            Số di động<span class="required">*</span>
                        </label>

                        <input type="tel" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại" required>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">
                            Mật khẩu<span class="required">*</span>
                        </label>

                        <input type="password" id="password" th:field="*{password}" placeholder="Nhập mật khẩu"
                            required>
                    </div>

                    <!-- Confirm password -->
                    <div class="form-group">
                        <label for="confirmPassword">
                            Nhập lại mật khẩu<span class="required">*</span>
                        </label>

                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                            placeholder="Nhập lại mật khẩu" required>
                    </div>

                    <!-- Address -->
                    <div class="form-group">
                        <label for="address">
                            Địa chỉ<span class="required">*</span>
                        </label>

                        <textarea id="address" th:field="*{address}" rows="3" placeholder="Nhập địa chỉ của bạn"
                            required></textarea>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="register-button register-submit">
                        Đăng ký
                    </button>

                </form>

            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
