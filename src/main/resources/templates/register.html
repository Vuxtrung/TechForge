<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Đăng ký - TechForge</title>
</head>

<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="login-page">
        <div class="register-container">
            <section class="register-form-box">
                <h1>Tạo tài khoản khách hàng cá nhân</h1>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="register-form">

                    <div th:if="${registerError}" class="alert alert-danger" th:text="${registerError}"></div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email đăng ký<span class="required">*</span></label>
                        <input type="text" id="email" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="Nhập email của bạn">
                        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>

                    <!-- Name -->
                    <div class="form-group">
                        <label for="fullName">Tên<span class="required">*</span></label>
                        <input type="text" id="fullName" th:field="*{fullName}"
                               th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                               placeholder="Nhập tên của bạn">
                        <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">Số di động<span class="required">*</span></label>
                        <input type="tel" id="phone" th:field="*{phone}"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               placeholder="Nhập số điện thoại">
                        <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Mật khẩu<span class="required">*</span></label>
                        <input type="password" id="password" th:field="*{password}"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               placeholder="Nhập mật khẩu">
                        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>

                    <!-- Confirm password -->
                    <div class="form-group">
                        <label for="confirmPassword">Nhập lại mật khẩu<span class="required">*</span></label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               placeholder="Nhập lại mật khẩu">
                        <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                    </div>

                    <!-- Province -->
                    <div class="form-group">
                        <label for="province">Tỉnh/Thành phố<span class="required">*</span></label>
                        <select id="province" th:field="*{province}" class="form-select"
                                th:classappend="${#fields.hasErrors('province')} ? 'is-invalid'">
                            <option value="">-- Chọn Tỉnh/Thành phố --</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('province')}" th:errors="*{province}"></span>
                    </div>

                    <!-- Ward -->
                    <div class="form-group">
                        <label for="ward">Phường/Xã<span class="required">*</span></label>
                        <select id="ward" th:field="*{ward}" class="form-select"
                                th:classappend="${#fields.hasErrors('ward')} ? 'is-invalid'"
                                disabled>
                            <option value="">-- Chọn Phường/Xã --</option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('ward')}" th:errors="*{ward}"></span>
                    </div>

                    <!-- Address line -->
                    <div class="form-group">
                        <label for="addressLine">Địa chỉ chi tiết<span class="required">*</span></label>
                        <textarea id="addressLine" th:field="*{addressLine}" rows="3"
                                  th:classappend="${#fields.hasErrors('addressLine')} ? 'is-invalid'"
                                  placeholder="Số nhà, tên đường, khu phố..."></textarea>
                        <span class="field-error" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}"></span>
                    </div>

                    <button type="submit" class="register-button register-submit">Đăng ký</button>
                </form>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const provinceSelect = document.getElementById("province");
            const wardSelect = document.getElementById("ward");

            const selectedProvince = provinceSelect.value;
            const selectedWard = wardSelect.value;

            try {
                const response = await fetch("https://provinces.open-api.vn/api/v2/p/");

                if (!response.ok) {
                    throw new Error("Không thể tải danh sách tỉnh/thành phố");
                }

                const provinces = await response.json();

                provinces.forEach(province => {
                    const option = document.createElement("option");
                    option.value = province.name;
                    option.textContent = province.name;
                    option.dataset.code = province.code;

                    if (province.name === selectedProvince) {
                        option.selected = true;
                    }

                    provinceSelect.appendChild(option);
                });

                if (selectedProvince) {
                    const selectedOption = provinceSelect.options[provinceSelect.selectedIndex];
                    await loadWards(selectedOption.dataset.code, selectedWard);
                }
            } catch (error) {
                console.error("Lỗi tải tỉnh/thành phố:", error);
            }

            provinceSelect.addEventListener("change", async () => {
                const selectedOption = provinceSelect.options[provinceSelect.selectedIndex];
                const provinceCode = selectedOption.dataset.code;

                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                wardSelect.disabled = true;

                if (!provinceCode) {
                    return;
                }

                await loadWards(provinceCode);
            });

            async function loadWards(provinceCode, selectedWard = "") {
                wardSelect.innerHTML = '<option value="">-- Chọn Phường/Xã --</option>';
                wardSelect.disabled = true;

                try {
                    const response = await fetch(
                        `https://provinces.open-api.vn/api/v2/w/?province=${provinceCode}`
                    );

                    if (!response.ok) {
                        throw new Error("Không thể tải danh sách phường/xã");
                    }

                    const wards = await response.json();

                    wards.forEach(ward => {
                        const option = document.createElement("option");
                        option.value = ward.name;
                        option.textContent = ward.name;

                        if (ward.name === selectedWard) {
                            option.selected = true;
                        }

                        wardSelect.appendChild(option);
                    });

                    wardSelect.disabled = false;
                } catch (error) {
                    console.error("Lỗi tải phường/xã:", error);
                }
            }
        });
    </script>

</body>

</html>
