<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"><title>Tạo phiếu bảo hành - TechForge</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body container-fluid px-lg-5 my-4">
    <nav aria-label="breadcrumb" class="mb-3"><ol class="breadcrumb fs-7"><li class="breadcrumb-item"><a th:href="@{/account(view='orders')}" class="text-decoration-none text-muted">Đơn hàng của tôi</a></li><li class="breadcrumb-item active text-danger">Tạo phiếu bảo hành</li></ol></nav>
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="bg-white rounded-3 shadow-sm border p-4">
            <div class="d-flex align-items-center gap-2 border-bottom pb-3 mb-4"><i class="bi bi-shield-plus text-success fs-3"></i><div><h1 class="h4 mb-1">Tạo phiếu bảo hành 1 đổi 1</h1><p class="text-muted small mb-0">Sản phẩm đã mua trong đơn hàng của bạn</p></div></div>
            <div class="bg-light rounded p-3 mb-4"><div class="small text-muted">Đơn hàng</div><strong th:text="${'#' + order.orderId}"></strong><span class="mx-2">|</span><span th:text="${orderItem.productName}"></span></div>
            <form th:action="@{/customer/warranty/create}" method="post">
                <input type="hidden" name="orderId" th:value="${order.orderId}"><input type="hidden" name="orderItemId" th:value="${orderItem.orderItemId}">
                <div class="mb-3"><label for="imeiSerial" class="form-label fw-semibold">IMEI / Serial sản phẩm <span class="text-danger">*</span></label><input id="imeiSerial" name="imeiSerial" class="form-control" required maxlength="100" placeholder="Nhập IMEI hoặc Serial trên sản phẩm"></div>
                <div class="mb-4"><label for="issueDesc" class="form-label fw-semibold">Mô tả vấn đề</label><textarea id="issueDesc" name="issueDesc" class="form-control" rows="5" maxlength="2000" placeholder="Mô tả lỗi hoặc tình trạng sản phẩm cần bảo hành"></textarea></div>
                <div class="d-flex justify-content-end gap-2"><a th:href="@{/orders/{id}(id=${order.orderId})}" class="btn btn-outline-secondary">Hủy</a><button type="submit" class="btn btn-success"><i class="bi bi-send me-1"></i>Gửi phiếu bảo hành</button></div>
            </form>
        </div>
    </div></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
