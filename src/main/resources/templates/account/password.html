<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="content">
        <div class="d-flex align-items-center border-bottom pb-3 mb-4">
            <i class="bi bi-shield-lock text-warning fs-4 me-2"></i>
            <h5 class="fw-bold text-dark mb-0">Thay đổi mật khẩu</h5>
        </div>

        <form id="changePasswordForm" th:action="@{/account/password}"
              th:object="${changePasswordRequest}" method="post" novalidate>
            <div class="row g-3">

                <!-- Current password -->
                <div class="col-12">
                    <label class="form-label fs-7 fw-semibold">Mật khẩu hiện tại <span
                            class="text-danger">*</span></label>
                    <div class="password-field">
                        <input type="password" th:field="*{currentPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"
                               placeholder="Nhập mật khẩu hiện tại" autocomplete="current-password">
                    </div>
                    <div class="text-danger fs-8 mt-1"
                         th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}"></div>
                </div>

                <!-- New password -->
                <div class="col-12">
                    <label class="form-label fs-7 fw-semibold">Mật khẩu mới <span class="text-danger">*</span></label>
                    <div class="password-field">
                        <input type="password" th:field="*{newPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                               placeholder="Nhập mật khẩu mới" autocomplete="new-password">
                    </div>
                    <div class="text-danger fs-8 mt-1"
                         th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                </div>

                <!-- Confirm password -->
                <div class="col-12">
                    <label class="form-label fs-7 fw-semibold">Xác nhận mật khẩu mới <span
                            class="text-danger">*</span></label>
                    <div class="password-field">
                        <input type="password" th:field="*{confirmPassword}" class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               placeholder="Nhập lại mật khẩu mới" autocomplete="new-password">
                    </div>
                    <div class="text-danger fs-8 mt-1"
                         th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

            </div>

            <div class="mt-4 p-3 bg-light rounded-3 border">
                <div class="fw-semibold text-dark fs-7 mb-2">
                    <i class="bi bi-shield-check text-success me-1"></i>
                    Lưu ý khi đặt mật khẩu
                </div>
                <ul class="mb-0 ps-4 text-muted fs-8">
                    <li>Mật khẩu phải có ít nhất 6 ký tự.</li>
                    <li>Không nên sử dụng mật khẩu quá dễ đoán.</li>
                    <li>Mật khẩu mới và mật khẩu xác nhận phải giống nhau.</li>
                </ul>
            </div>

            <!-- Submit -->
            <div class="d-flex justify-content-between mt-4 pt-3 border-top">
                <a th:href="@{/forgot-password}" class="btn btn-secondary btn-sm px-4 fw-bold"><i class="bi bi-key me-1"></i> Quên mật khẩu</a>
                <button type="submit" class="btn btn-danger btn-sm px-4 fw-bold">
                    <i class="bi bi-key-fill me-1"></i>
                    Đổi mật khẩu
                </button>
            </div>
        </form>

    </div>

</body>

</html>
