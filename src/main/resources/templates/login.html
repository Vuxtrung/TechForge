<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Đăng nhập - TechForge</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- Login -->
    <main class="login-page">
        <div class="login-container">
            <section class="login-box">
                <h1>Thông tin khách hàng đăng nhập hệ thống</h1>
                <form th:action="@{/login}" method="post" class="login-form">
                    <div class="form-group">
                        <label for="email"> Email đăng nhập </label>
                        <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
                    </div>
                    <div class="form-group">
                        <label for="password"> Mật khẩu </label>
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="login-button"> Đăng nhập </button>
                    <a th:href="@{/forgot-password}" class="forgot-password"> Quên mật khẩu? </a>
                </form>
            </section>
            <section class="register-box">
                <h2>Bạn chưa là thành viên?</h2>
                <p> Đăng ký là thành viên để hưởng nhiều lợi ích và đặt mua hàng dễ dàng hơn. </p> <a
                    th:href="@{/register}" class="register-button"> Đăng ký tài khoản </a>
            </section>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
