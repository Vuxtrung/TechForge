<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TechForge - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {

                        "on-error": "#690005",

                        "surface-container-lowest": "#0e0e0e",
                        "tertiary": "#ffd59c",
                        "secondary-fixed": "#79ff5b",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#2ae500",
                        "on-surface-variant": "#bbc9cf",
                        "on-primary-container": "#00566a",
                        "outline": "#859399",
                        "surface-dim": "#131313",
                        "on-primary-fixed": "#001f28",
                        "on-surface": "#e5e2e1",
                        "primary-container": "#00d1ff",
                        "surface-container": "#201f1f",
                        "surface-bright": "#393939",
                        "primary-fixed": "#b7eaff",
                        "on-tertiary-container": "#6b4700",
                        "primary": "#a4e6ff",
                        "on-background": "#e5e2e1",
                        "error-container": "#93000a",
                        "background": "#131313",
                        "surface-variant": "#353534",
                        "on-error-container": "#ffdad6",
                        "on-secondary-container": "#0f6d00",
                        "on-tertiary": "#442b00",
                        "on-secondary": "#053900",
                        "on-primary-fixed-variant": "#004e60",
                        "on-primary": "#003543",
                        "on-tertiary-fixed-variant": "#624000",
                        "surface-container-low": "#1c1b1b",
                        "secondary": "#d7ffc5",
                        "surface-tint": "#4cd6ff",

                        "tertiary-fixed-dim": "#ffba49",
                        "surface-container-highest": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "inverse-primary": "#00677f",
                        "on-secondary-fixed": "#022100",
                        "on-tertiary-fixed": "#291800",
                        "outline-variant": "#3c494e",
                        "surface": "#131313",
                        "inverse-on-surface": "#313030",
                        "on-secondary-fixed-variant": "#095300",
                        "primary-fixed-dim": "#4cd6ff",
                        "tertiary-container": "#feb127",
                        "surface-container-high": "#2a2a2a"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        unit: "8px",
                        "margin-mobile": "16px",
                        "margin-desktop": "64px",
                        "gutter": "24px",
                        "container-max": "1440px"
                    },
                    fontFamily: {
                        "headline-md": ["Inter"],
                        "label-mono": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {

                        "body-md": ["16px", { lineHeight: "1.6", letterSpacing: "0", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(18, 18, 18, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .neon-glow {
            box-shadow: 0 0 40px rgba(0, 209, 255, 0.15);
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(0, 209, 255, 0.4);
        }

        .input-field {
            background: #121212;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-bottom-color: #00D1FF;
            box-shadow: 0 10px 20px -10px rgba(0, 209, 255, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Back to Home Button (Top Left) -->
<a href="/" th:href="@{/}" class="fixed top-6 left-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-full bg-surface-container/80 hover:bg-surface-container text-on-surface hover:text-primary-container border border-white/10 backdrop-blur-md shadow-lg transition-all duration-300 group text-decoration-none" title="Trở về Trang Chủ TechForge">
    <span class="material-symbols-outlined text-[22px] group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>
    <span class="font-label-mono text-label-mono uppercase tracking-wider text-xs font-semibold">Trang Chủ</span>
</a>
<!-- Background Texture/Image -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center opacity-30 mix-blend-luminosity" data-alt="A dark, moody, highly detailed macro photograph of premium computer hardware components, featuring a textured matte black circuit board with subtle, tracing metallic lines. The scene is illuminated by faint, ambient electric blue and deep green LEDs that create a moody, cyberpunk-inspired atmosphere. The depth of field is shallow, emphasizing the precision engineering and industrial design. The overall aesthetic is sleek, powerful, and high-tech." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCiTHFSvq0DLzXTmqpJ6_vV6g_TdZDn-Nep131eEAWALbt5AV8ON654Mo_GG1ea62Ob2y61SCU-lsPIVwhMBimF-Z0PyG1LT5r2FKtmQT1cZ4ZBEIC6IETmGiaYXlaFJuYPrvC-cVO1-qPywyTy2jGbOzcn9raJd5-9caAJp_0309R7k2LKZ2L4AJXaqolZkC07yt3z6ylBNhIq-zirZtUOQT9TukcnUiKEY3AHYUhaGo5rN3DgpmTl')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-background/80 to-background"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full px-margin-mobile md:px-margin-desktop py-16 flex items-center justify-center min-h-screen">
<div class="glass-panel w-full max-w-md rounded-xl p-8 md:p-12 neon-glow">
<!-- Brand Logo -->
<div class="text-center mb-12">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg tracking-tighter text-primary-container leading-none">Tech<br/>Forge</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant mt-4 uppercase">Secure Access Terminal</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-8" method="POST">
<div class="space-y-6">
<div class="relative">
<label class="sr-only font-label-mono text-label-mono" for="email">Email Address</label>
<div class="absolute inset-y-0 left-0 flex items-center pointer-events-none pb-2 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input autocomplete="email" class="input-field block w-full pl-8 pr-3 py-3 text-on-surface placeholder-on-surface-variant/50 font-label-mono text-label-mono focus:ring-0" id="email" name="email" placeholder="COMMANDER@NEON.SYS" required="" type="email"/>
</div>
<div class="relative">
<label class="sr-only font-label-mono text-label-mono" for="password">Password</label>
<div class="absolute inset-y-0 left-0 flex items-center pointer-events-none pb-2 text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input autocomplete="current-password" class="input-field block w-full pl-8 pr-10 py-3 text-on-surface placeholder-on-surface-variant/50 font-label-mono text-label-mono focus:ring-0" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-6">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-white/20 bg-surface text-primary-container focus:ring-primary-container focus:ring-offset-surface" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-mono text-label-mono text-primary-container hover:text-primary transition-colors duration-200" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<div class="pt-4">
<button class="btn-primary w-full flex justify-center py-4 px-4 border border-transparent rounded-DEFAULT shadow-sm font-label-mono text-label-mono font-bold text-[#000000] bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container focus:ring-offset-surface transition-all duration-300 uppercase tracking-widest" type="submit">
                        Initialize Connection
                        <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        New pilot? 
                        <a class="font-label-mono text-label-mono text-primary-container hover:text-primary transition-colors duration-200 ml-2" href="/register">Request Access</a>
</p>
</div>
</form>
</div>
</main>
</body></html>
