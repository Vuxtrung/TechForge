<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Tài khoản - TechForge</title>
</head>

<body>

    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body container-fluid px-lg-5 my-4">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb fs-7">
                <li class="breadcrumb-item">
                    <a th:href="@{/}" class="text-decoration-none text-muted">
                        Trang chủ
                    </a>
                </li>

                <li class="breadcrumb-item active text-danger fw-semibold" aria-current="page">
                    Tài khoản
                </li>
            </ol>
        </nav>

        <div class="row g-4">

            <!-- ========================= -->
            <!-- LEFT: ACCOUNT MENU -->
            <!-- ========================= -->
            <div class="col-lg-3">
                <div class="bg-white rounded-3 shadow-sm border p-3">
                    <!-- User summary -->
                    <div class="d-flex align-items-center gap-3 pb-3 mb-3 border-bottom">

                        <!-- Avatar -->
                        <div class="flex-shrink-0">
                            <!-- Có avatar -->
                            <img th:if="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)}"
                                th:src="${user.avatarUrl}" th:alt="${user.fullName}"
                                class="rounded-circle object-fit-cover" style="width: 65px; height: 65px;">

                            <!-- Không có avatar -->
                            <div th:unless="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)}" class="rounded-circle bg-danger-subtle text-danger
                                d-flex align-items-center justify-content-center" style="width: 65px; height: 65px;">
                                <i class="bi bi-person-fill fs-2"></i>
                            </div>
                        </div>

                        <!-- User information -->
                        <div class="overflow-hidden">
                            <div class="text-muted fs-8">
                                Tài khoản
                            </div>

                            <h6 class="fw-bold text-dark mb-0 text-truncate" th:text="${user.fullName}">
                                Nguyễn Văn A
                            </h6>
                        </div>
                    </div>


                    <!-- Account menu -->
                    <div class="list-group list-group-flush">

                        <!-- Thông tin tài khoản -->
                        <a th:href="@{/account(view='info')}" class="list-group-item list-group-item-action
                                  border-0 rounded-2 px-2 py-3">
                            <i class="bi bi-person-circle text-danger me-2"></i>
                            <span class="fs-7 fw-semibold">
                                Thông tin tài khoản
                            </span>
                        </a>


                        <!-- Quản lý đơn hàng -->
                        <a th:href="@{/account(view='orders')}"
                            th:if="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}"
                            class="list-group-item list-group-item-action
                                  border-0 rounded-2 px-2 py-3">
                            <i class="bi bi-box-seam text-primary me-2"></i>
                            <span class="fs-7 fw-semibold">
                                Quản lý đơn hàng
                            </span>
                        </a>

                        <!-- Thay đổi mật khẩu -->
                        <a th:href="@{/account(view='password')}" class="list-group-item list-group-item-action
                                  border-0 rounded-2 px-2 py-3">
                            <i class="bi bi-shield-lock text-warning me-2"></i>
                            <span class="fs-7 fw-semibold">
                                Thay đổi mật khẩu
                            </span>
                        </a>


                        <!-- Admin / Warranty panel -->
                        <a th:if="${user.role != null and (user.role.roleName == 'ADMIN' or user.role.roleName == 'STAFF_WARRANTY')}"
                            th:href="@{/admin}" class="list-group-item list-group-item-action
                                  border-0 rounded-2 px-2 py-3">

                            <i class="bi bi-speedometer2 text-success me-2"></i>

                            <span class="fs-7 fw-semibold">
                                Quản trị hệ thống
                            </span>

                        </a>

                        <!-- Đăng xuất -->
                        <form th:action="@{/logout}" method="post" class="m-0">
                            <button type="submit" class="list-group-item list-group-item-action
                                           border-0 rounded-2 px-2 py-3
                                           text-danger w-100 text-start">

                                <i class="bi bi-box-arrow-right me-2"></i>

                                <span class="fs-7 fw-semibold">
                                    Đăng xuất
                                </span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>


            <!-- ========================= -->
            <!-- RIGHT: CONTENT -->
            <!-- ========================= -->
            <div class="col-lg-9">
                <div class="bg-white rounded-3 shadow-sm border p-4 h-100">

                    <!-- Error Messages -->
                    <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center py-2"
                        role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${successMessage}"></span>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center py-2" role="alert">
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <!-- Chưa chọn chức năng -->
                    <div th:if="${view == null}" class="d-flex flex-column align-items-center
                    justify-content-center text-center" style="min-height: 400px;">
                        <i class="bi bi-person-circle text-muted" style="font-size: 4rem;"></i>
                        <h5 class="fw-bold text-dark mt-3 mb-2">
                            Bạn đang ở trang tài khoản
                        </h5>
                        <p class="text-muted fs-7 mb-0">
                            Vui lòng chọn các mục bên trái để xem thông tin.
                        </p>
                    </div>

                    <!-- Nội dung tab, include động theo view -->
                    <div th:switch="${view}">
                        <div th:case="'info'">
                            <div th:replace="~{account/info :: content}"></div>
                        </div>
                        <div th:case="'orders'">
                            <div th:replace="~{account/orders :: content}"></div>
                        </div>
                        <div th:case="'password'">
                            <div th:replace="~{account/password :: content}"></div>
                        </div>
                    </div>
                </div>
            </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
