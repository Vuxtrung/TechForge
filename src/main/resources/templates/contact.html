<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Liên hệ - TechForge</title>
    <th:block th:replace="~{fragments/header :: header-head}"></th:block>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body container-fluid px-lg-5 my-4">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb fs-7">
                <li class="breadcrumb-item">
                    <a th:href="@{/}" class="text-decoration-none text-muted">
                        Trang chủ
                    </a>
                </li>
                <li class="breadcrumb-item active text-danger fw-semibold" aria-current="page">
                    Liên hệ
                </li>
            </ol>
        </nav>

        <!-- Page title -->
        <div class="mb-4">
            <h4 class="fw-bold text-dark mb-1">
                <i class="bi bi-telephone text-danger me-2"></i>
                LIÊN HỆ
            </h4>
        </div>
        <div class="row justify-content-center">
            <div class="col-6 bg-white rounded-3 shadow-sm border p-4 h-100">
                <h5 class="fw-bold text-dark mb-3">
                    <i class="bi bi-feather text-danger me-2"></i>
                    Điền thông tin liên hệ
                </h5>
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                <form th:action="@{/contact}" th:object="${contactRequest}" method="post">
                    <div class="form-group">
                        <label>Họ và tên<span class="required">*</span></label>
                        <input type="text" th:field="*{fullName}" required />
                        <div th:if="${#fields.hasErrors('fullName')}" class="text-danger" th:errors="*{fullName}"></div>
                    </div>

                    <div class="form-group">
                        <label>Email<span class="required">*</span></label>
                        <input type="email" th:field="*{email}" required />
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>
                    </div>

                    <div class="form-group">
                        <label>Tiêu đề<span class="required">*</span></label>
                        <input type="text" th:field="*{subject}" required />
                        <div th:if="${#fields.hasErrors('subject')}" class="text-danger" th:errors="*{subject}"></div>
                    </div>

                    <div class="form-group">
                        <label>Nội dung<span class="required">*</span></label>
                        <textarea th:field="*{message}" rows="5" required></textarea>
                        <div th:if="${#fields.hasErrors('message')}" class="text-danger" th:errors="*{message}"></div>
                    </div>

                    <div class="g-recaptcha mt-3" data-sitekey="6LdM0JMtAAAAALGE3bOz-GHS9v1vP29N5OgBOk8q"></div>
                    <div th:if="${#fields.hasErrors('global')}" style="color: red;">
                    </div>
                    <p th:if="${param.error}" style="color: red;" th:text="'Xác thực captcha thất bại!'"></p>

                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm mt-3">Gửi liên hệ</button>
                </form>
            </div>
        </div>

    </main>
    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
