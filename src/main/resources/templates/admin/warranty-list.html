<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title>Quản lý bảo hành</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="main-body">
    <section class="container-fluid px-lg-5 my-4">
        <div class="bg-white rounded-3 shadow-sm border p-4">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                <span class="fs-4 text-dark fw-bold">
                    <i class="bi bi-shield-check text-success"></i> Quản lý bảo hành
                </span>
                <button class="btn btn-success fw-semibold" data-bs-toggle="modal" data-bs-target="#receiveWarrantyModal">
                    <i class="bi bi-plus-lg me-1"></i> Tiếp nhận sản phẩm
                </button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/admin/warranty}" method="get" class="row g-2 align-items-end mb-3">
                <div class="col-md-4">
                    <label class="form-label fs-8 text-muted mb-1">Tìm kiếm</label>
                    <input type="search" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tên khách hàng, email, imei, mô tả lỗi..." />
                </div>
                <div class="col-md-3">
                    <label class="form-label fs-8 text-muted mb-1">Trạng thái</label>
                    <select name="status" class="form-select">
                        <option value="" th:selected="${status == null || status == ''}">Tất cả</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}" th:selected="${status == s.name()}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fs-8 text-muted mb-1">Sắp xếp</label>
                    <select name="sort" class="form-select">
                        <option value="createdAt,desc" th:selected="${sort == 'createdAt,desc'}">Ngày tiếp nhận mới nhất</option>
                        <option value="createdAt,asc" th:selected="${sort == 'createdAt,asc'}">Ngày tiếp nhận cũ nhất</option>
                        <option value="resolvedAt,desc" th:selected="${sort == 'resolvedAt,desc'}">Ngày xử lý mới nhất</option>
                        <option value="resolvedAt,asc" th:selected="${sort == 'resolvedAt,asc'}">Ngày xử lý cũ nhất</option>
                        <option value="status,asc" th:selected="${sort == 'status,asc'}">Trạng thái A-Z</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark flex-grow-1">Lọc</button>
                    <a th:href="@{/admin/warranty}" class="btn btn-outline-secondary">Reset</a>
                </div>
                <div class="col-12">
                    <a class="btn btn-success"
                       th:href="@{/admin/warranty/export(keyword=${keyword}, status=${status})}">
                        <i class="bi bi-file-earmark-excel me-1"></i> Xuất Excel
                    </a>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Khách hàng</th>
                        <th>IMEI / Serial</th>
                        <th>Vấn đề</th>
                        <th>Nhân viên</th>
                        <th>Trạng thái</th>
                        <th>Ngày tiếp nhận</th>
                        <th>Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${ticketPage.empty}">
                        <td colspan="8" class="text-center text-muted py-4">Chưa có phiếu bảo hành nào.</td>
                    </tr>
                    <tr th:each="ticket, iter : ${ticketPage.content}">
                        <td th:text="${ticketPage.number * ticketPage.size + iter.index + 1}">1</td>
                        <td>
                            <div class="fw-semibold" th:text="${ticket.user.fullName}">Tên khách</div>
                            <small class="text-muted" th:text="${ticket.user.email}">email</small>
                        </td>
                        <td th:text="${ticket.imeiSerial}">IMEI</td>
                        <td class="text-wrap" th:text="${ticket.issueDesc != null ? ticket.issueDesc : '—'}">Lỗi</td>
                        <td th:text="${ticket.assignedStaff != null ? ticket.assignedStaff.fullName : 'Chưa phân công'}">Nhân viên</td>
                        <td>
                            <span class="badge bg-primary" th:text="${ticket.status}"></span>
                        </td>
                        <td th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày</td>
                        <td>
                            <a th:href="@{/admin/warranty/{id}(id=${ticket.ticketId})}" class="btn btn-outline-primary btn-sm">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:if="${ticketPage.totalPages > 1}" aria-label="Pagination">
                <ul class="pagination justify-content-center mt-3">
                    <li class="page-item" th:classappend="${ticketPage.first} ? 'disabled' : ''"><a class="page-link" th:if="${!ticketPage.first}" th:href="@{/admin/warranty(page=0, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-double-left"></i></a><span class="page-link" th:if="${ticketPage.first}"><i class="bi bi-chevron-double-left"></i></span></li>
                    <li class="page-item" th:classappend="${ticketPage.first} ? 'disabled' : ''"><a class="page-link" th:if="${!ticketPage.first}" th:href="@{/admin/warranty(page=${ticketPage.number - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-left"></i></a><span class="page-link" th:if="${ticketPage.first}"><i class="bi bi-chevron-left"></i></span></li>
                    <li class="page-item" th:classappend="${ticketPage.number == 0} ? 'active'"><a class="page-link" th:if="${ticketPage.number != 0}" th:href="@{/admin/warranty(page=0, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}">1</a><span class="page-link" th:if="${ticketPage.number == 0}">1</span></li>
                    <li class="page-item disabled" th:if="${ticketPage.number > 2}"><span class="page-link">...</span></li>
                    <th:block th:with="start=${T(java.lang.Math).max(1, ticketPage.number - 1)}, end=${T(java.lang.Math).min(ticketPage.totalPages - 2, ticketPage.number + 1)}"><th:block th:if="${start <= end}" th:each="i : ${#numbers.sequence(start, end)}"><li class="page-item" th:classappend="${i == ticketPage.number} ? 'active'"><a class="page-link" th:if="${i != ticketPage.number}" th:href="@{/admin/warranty(page=${i}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}" th:text="${i + 1}"></a><span class="page-link" th:if="${i == ticketPage.number}" th:text="${i + 1}"></span></li></th:block></th:block>
                    <li class="page-item disabled" th:if="${ticketPage.number < ticketPage.totalPages - 3}"><span class="page-link">...</span></li>
                    <li class="page-item" th:classappend="${ticketPage.last} ? 'active'"><a class="page-link" th:if="${!ticketPage.last}" th:href="@{/admin/warranty(page=${ticketPage.totalPages - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}" th:text="${ticketPage.totalPages}"></a><span class="page-link" th:if="${ticketPage.last}" th:text="${ticketPage.totalPages}"></span></li>
                    <li class="page-item" th:classappend="${ticketPage.last} ? 'disabled' : ''"><a class="page-link" th:if="${!ticketPage.last}" th:href="@{/admin/warranty(page=${ticketPage.number + 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-right"></i></a><span class="page-link" th:if="${ticketPage.last}"><i class="bi bi-chevron-right"></i></span></li>
                    <li class="page-item" th:classappend="${ticketPage.last} ? 'disabled' : ''"><a class="page-link" th:if="${!ticketPage.last}" th:href="@{/admin/warranty(page=${ticketPage.totalPages - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-double-right"></i></a><span class="page-link" th:if="${ticketPage.last}"><i class="bi bi-chevron-double-right"></i></span></li>
                </ul>
            </nav>
        </div>
    </section>
</main>

<div class="modal fade" id="receiveWarrantyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form th:action="@{/admin/warranty/receive}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">Tiếp nhận sản phẩm bảo hành</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body row g-3">
                    <div class="col-md-6">
                        <label class="form-label">User ID</label>
                        <input type="number" name="userId" class="form-control" placeholder="Nhập userId" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">IMEI / Serial</label>
                        <input type="text" name="imeiSerial" class="form-control" placeholder="Nhập IMEI hoặc serial" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Số điện thoại tra cứu</label>
                        <input type="text" name="phoneLookup" class="form-control" placeholder="SĐT khách hàng" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Order Item ID</label>
                        <input type="number" name="orderItemId" class="form-control" placeholder="Nếu có" />
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả sự cố</label>
                        <textarea name="issueDesc" class="form-control" rows="4" placeholder="Mô tả triệu chứng, lỗi, thời gian gặp sự cố..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success">Tiếp nhận</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
