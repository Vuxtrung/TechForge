<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title>Quản Lý Compatibility Rules</title>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
      
      <!-- Main Content -->
      <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid">
        <div class="bg-white rounded-3 shadow-sm border p-4">
          <!-- Page Title + Add button -->
          <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
            <span class="fs-4 text-dark fw-bold">
              <i class="bi bi-shield-check text-danger"></i> Quản Lý Quy Tắc Build PC
            </span>
            <a th:href="@{/admin/compatibility-rules/create}" class="btn btn-danger fw-semibold">
              <i class="bi bi-plus-lg me-1"></i> Thêm Quy Tắc
            </a>
          </div>

          <!-- Flash messages -->
          <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle me-1"></i>
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <!-- Table -->
          <div class="table-responsive">
            <table class="table table-hover table-bordered align-middle">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="text-center" style="width: 50px;">ID</th>
                  <th scope="col">Tên Quy Tắc</th>
                  <th scope="col">Biểu Thức (SpEL)</th>
                  <th scope="col">Mức Độ</th>
                  <th scope="col">Thông Báo</th>
                  <th scope="col" class="text-center">Trạng Thái</th>
                  <th scope="col" class="text-center" style="width: 150px;">Thao Tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="rule : ${rules}">
                  <td class="text-center fw-semibold text-secondary" th:text="${rule.id}">1</td>
                  <td class="fw-semibold text-dark" th:text="${rule.ruleName}">Tên</td>
                  <td class="font-monospace small bg-light" th:text="${rule.expression}">Biểu thức</td>
                  <td>
                    <span th:if="${rule.severity == 'ERROR'}" class="badge bg-danger">Lỗi</span>
                    <span th:if="${rule.severity == 'WARNING'}" class="badge bg-warning text-dark">Cảnh Báo</span>
                  </td>
                  <td th:text="${rule.message}">Thông báo</td>
                  <td class="text-center">
                    <a th:href="@{/admin/compatibility-rules/toggle/{id}(id=${rule.id})}" 
                       class="btn btn-sm" th:classappend="${rule.isActive ? 'btn-outline-success' : 'btn-outline-secondary'}">
                      <i class="bi" th:classappend="${rule.isActive ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                      <span th:text="${rule.isActive ? 'Đang bật' : 'Đã tắt'}"></span>
                    </a>
                  </td>
                  <td class="text-center">
                    <a th:href="@{/admin/compatibility-rules/edit/{id}(id=${rule.id})}"
                       class="btn btn-sm btn-outline-primary" title="Sửa">
                      <i class="bi bi-pencil-square"></i>
                    </a>
                    <a th:href="@{/admin/compatibility-rules/delete/{id}(id=${rule.id})}"
                       class="btn btn-sm btn-outline-danger" title="Xóa"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa quy tắc này?');">
                      <i class="bi bi-trash"></i>
                    </a>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rules)}">
                  <td colspan="7" class="text-center text-muted py-4">Chưa có quy tắc nào</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        </div>
      </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer-scripts}"></div>
  </body>
</html>
