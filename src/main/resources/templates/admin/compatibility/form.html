<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title>Thêm/Sửa Quy Tắc</title>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
      
      <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid">
          <div class="bg-white rounded-3 shadow-sm border p-4" style="max-width: 800px; margin: 0 auto;">
            
            <div class="d-flex align-items-center mb-4 border-bottom pb-3">
              <a th:href="@{/admin/compatibility-rules}" class="btn btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i> Quay Lại
              </a>
              <span class="fs-4 text-dark fw-bold">
                <i class="bi bi-shield-check text-danger"></i>
                <span th:text="${rule.id == null ? 'Thêm Quy Tắc Mới' : 'Cập Nhật Quy Tắc'}"></span>
              </span>
            </div>

            <form th:action="@{/admin/compatibility-rules/save}" th:object="${rule}" method="post">
              <input type="hidden" name="id" th:value="${rule.id}" />
              <input type="hidden" name="isActive" th:value="${rule.getIsActive()}" />

              <div class="mb-3">
                <label for="ruleName" class="form-label fw-bold">Tên Quy Tắc <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="ruleName" name="ruleName" th:value="${rule.ruleName}" required
                       placeholder="Ví dụ: Kiểm tra Socket CPU và Mainboard" />
              </div>

              <div class="mb-3">
                <label for="expression" class="form-label fw-bold">Biểu Thức SpEL <span class="text-danger">*</span></label>
                <textarea class="form-control font-monospace" id="expression" name="expression" th:text="${rule.expression}" rows="3" required
                          placeholder="Ví dụ: #CPU_Socket == #Mainboard_Socket" style="background-color: #f8f9fa;"></textarea>
                <div class="form-text">
                  <strong>Các biến hỗ trợ:</strong> <code>#CPU_Socket</code>, <code>#CPU_TDP</code>, <code>#Mainboard_Socket</code>, <code>#Mainboard_RAM_Type</code>, <code>#RAM_Type</code>, <code>#VGA_TDP</code>, <code>#PSU_Wattage</code>, <code>#Total_Wattage</code>
                </div>
              </div>

              <div class="mb-3">
                <label for="severity" class="form-label fw-bold">Loại Cảnh Báo <span class="text-danger">*</span></label>
                <select class="form-select" id="severity" name="severity">
                  <option value="ERROR" th:selected="${rule.severity == 'ERROR'}">Lỗi (Ngăn chặn Build)</option>
                  <option value="WARNING" th:selected="${rule.severity == 'WARNING'}">Cảnh Báo (Vẫn cho phép Build)</option>
                </select>
              </div>

              <div class="mb-4">
                <label for="message" class="form-label fw-bold">Nội Dung Thông Báo <span class="text-danger">*</span></label>
                <textarea class="form-control" id="message" name="message" th:text="${rule.message}" rows="2" required
                          placeholder="Ví dụ: Lỗi tương thích: Socket CPU không khớp với Mainboard."></textarea>
              </div>

              <div class="d-flex justify-content-end border-top pt-3">
                <button type="submit" class="btn btn-danger fw-semibold px-4">
                  <i class="bi bi-save me-1"></i> Lưu Quy Tắc
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </main>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
