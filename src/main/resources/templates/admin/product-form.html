<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title
      th:text="${product.productId == null ? 'Thêm Sản Phẩm' : 'Sửa Sản Phẩm'}"
    >
      Sản Phẩm
    </title>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

      <!-- Main Content -->
      <div
        class="content flex-grow-1 p-4 bg-light"
        style="min-height: calc(100vh - 72px)"
      >
        <div class="container-fluid">
          <div class="row justify-content-center">
            <div class="col-lg-10">
              <div class="bg-white rounded-3 shadow-sm border p-4">
                <div
                  class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2"
                >
                  <span class="fs-4 text-dark fw-bold">
                    <i class="bi bi-box-seam text-danger"></i>
                    <span
                      th:text="${product.productId == null ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'}"
                      >Sản Phẩm</span
                    >
                  </span>
                  <a
                    th:href="@{/admin/products}"
                    class="btn btn-outline-secondary btn-sm"
                  >
                    <i class="bi bi-arrow-left me-1"></i> Quay Lại Danh Sách
                  </a>
                </div>
                
                 <!-- Success and error messages -->
                <div
                  th:if="${successMessage}"
                  class="alert alert-success alert-dismissible fade show"
                  role="alert"
                >
                  <i class="bi bi-check-circle me-1"></i>
                  <span th:text="${successMessage}"></span>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                  ></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger">
                  <i class="bi bi-exclamation-triangle me-1"></i>
                  <span th:text="${errorMessage}"></span>
                </div>

                <form
                  th:action="${product.productId == null ? '/admin/products' : '/admin/products/' + product.productId}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data"
                  novalidate
                >
                  <!-- Name -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold"
                      >Tên Sản Phẩm <span class="text-danger">*</span></label
                    >
                    <input
                      type="text"
                      th:field="*{name}"
                      class="form-control"
                      th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                      placeholder="VD: PC Gaming AMD Ryzen 5 - RTX 4060"
                      required
                      maxlength="200"
                    />
                    <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"
                    ></div>
                  </div>

                  <div class="row">
                    <!-- Category -->
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold"
                        >Danh Mục <span class="text-danger">*</span></label
                      >
                      <select
                        th:field="*{categoryId}"
                        class="form-select"
                        required
                      >
                        <option value="">-- Chọn danh mục --</option>
                        <option
                          th:each="c : ${categories}"
                          th:value="${c.categoryId}"
                          th:text="${c.name}"
                          th:attr="data-cat-type=${c.type}, data-component-type=${c.componentType}"
                        >
                          Danh mục
                        </option>
                      </select>
                    </div>

                    <!-- Brand -->
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Thương Hiệu</label>
                      <input
                        type="text"
                        th:field="*{brand}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'"
                        placeholder="VD: Asus, MSI, Intel..."
                        maxlength="100"
                      />
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                    </div>
                  </div>

                  <!-- Description -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Mô Tả</label>
                    <textarea
                      th:field="*{description}"
                      class="form-control"
                      rows="4"
                      placeholder="Mô tả chi tiết sản phẩm..."
                    ></textarea>
                  </div>

                  <div class="row">
                    <!-- Price -->
                    <div class="col-md-4 mb-3">
                      <label class="form-label fw-semibold"
                        >Giá Bán (VNĐ) <span class="text-danger">*</span></label
                      >
                      <input
                        type="number"
                        th:field="*{basePrice}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('basePrice')} ? 'is-invalid'"
                        step="1000"
                        min="0"
                        placeholder="VD: 15000000"
                        required
                      />
                      <div
                        id="priceFormattedDisplay"
                        class="form-text text-danger fw-bold mt-1"
                      ></div>
                      <div
                        class="invalid-feedback"
                        th:if="${#fields.hasErrors('basePrice')}"
                        th:errors="*{basePrice}"
                      ></div>
                    </div>

                    <!-- Stock -->
                    <div class="col-md-4 mb-3">
                      <label class="form-label fw-semibold"
                        >Số Lượng Tồn Kho
                        <span class="text-danger">*</span></label
                      >
                      <input
                        type="number"
                        th:field="*{stockQuantity}"
                        class="form-control"
                        th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'"
                        min="0"
                        placeholder="0"
                        required
                      />
                      <div
                        class="invalid-feedback"
                        th:if="${#fields.hasErrors('stockQuantity')}"
                        th:errors="*{stockQuantity}"
                      ></div>
                    </div>

                    <!-- Status -->
                    <div class="col-md-4 mb-3">
                      <label class="form-label fw-semibold"
                        >Trạng Thái <span class="text-danger">*</span></label
                      >
                      <select th:field="*{status}" class="form-select"
                        th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" required>
                        <option value="ACTIVE">Đang bán</option>
                        <option value="HIDDEN">Đã ẩn</option>
                      </select>
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>
                  </div>

                  <!-- Image -->
                  <div class="mb-3">
                    <label class="form-label fw-semibold">Ảnh Sản Phẩm</label>
                    <div
                      class="mb-2"
                      th:if="${product.getPrimaryImageUrl() != null}"
                    >
                      <img
                        th:src="${product.getPrimaryImageUrl()}"
                        alt="Ảnh hiện tại"
                        style="max-height: 150px"
                        class="rounded border"
                      />
                    </div>
                    <input
                      type="file"
                      id="imageFile"
                      name="imageFile"
                      class="form-control"
                      accept="image/jpeg,image/png,image/webp"
                    />
                    <div class="form-text">
                      Chọn ảnh mới để tải lên (JPG, PNG, WEBP - tối đa 5MB).
                    </div>
                    <div
                      id="imageFileError"
                      class="text-danger fs-8 mt-1"
                      style="display: none"
                    ></div>
                  </div>

                  <div
                    style="
                      border-top: 1px solid #e5e5e5;
                      padding-top: 12px;
                      margin-top: 16px;
                    "
                  >
                    <label class="form-label fw-semibold d-block mb-2">
                      Thông Số Kỹ Thuật
                    </label>

                    <!-- Chưa chọn danh mục -->
                    <div id="specNone" class="text-muted fs-8">
                      Chọn danh mục ở trên để hiện đúng thông số cần nhập.
                    </div>

                    <!-- PC dựng sẵn (PC_PRODUCT): 8 ô cố định -->
                    <div id="specPcProduct" class="row" style="display: none">
                      <div class="col-md-6 mb-2">
                        <label class="form-label">CPU</label>
                        <input type="text" name="pcCpu" maxlength="255" class="form-control" placeholder="VD: Intel Core i9-14900K" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">Mainboard</label>
                        <input type="text" name="pcMainboard" maxlength="255" class="form-control" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">RAM</label>
                        <input type="text" name="pcRam" maxlength="255" class="form-control" placeholder="VD: 64GB DDR5" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">VGA</label>
                        <input type="text" name="pcVga" maxlength="255" class="form-control" placeholder="VD: RTX 4090 24GB" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">Ổ cứng</label>
                        <input type="text" name="pcStorage" maxlength="255" class="form-control" placeholder="VD: 2TB NVMe" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">Nguồn</label>
                        <input type="text" name="pcPsu" maxlength="255" class="form-control" placeholder="VD: 1000W Gold" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">Tản nhiệt</label>
                        <input type="text" name="pcCooler" maxlength="255" class="form-control" placeholder="VD: AIO 360mm" />
                      </div>
                      <div class="col-md-6 mb-2">
                        <label class="form-label">Case</label>
                        <input type="text" name="pcCase" maxlength="255" class="form-control" />
                      </div>
                    </div>

                    <!-- CPU -->
                    <div id="specCPU" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Socket <span class="text-danger">*</span></label>
                        <input type="text" name="socket" maxlength="30" class="form-control" placeholder="VD: LGA1700, AM5" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Số nhân (Cores)</label>
                        <input type="number" name="cores" class="form-control" min="1" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Số luồng (Threads)</label>
                        <input type="number" name="threads" class="form-control" min="1" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Xung nhịp cơ bản (GHz)</label>
                        <input type="number" step="0.01" name="baseClockGhz" class="form-control" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Xung nhịp boost (GHz)</label>
                        <input type="number" step="0.01" name="boostClockGhz" class="form-control" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">TDP (Watt)</label>
                        <input type="number" name="tdpWatt" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <div class="form-check mt-4">
                          <input type="checkbox" name="hasIgpu" value="true" class="form-check-input" id="hasIgpu" />
                          <label class="form-check-label" for="hasIgpu">Có iGPU tích hợp</label>
                        </div>
                      </div>
                    </div>

                    <!-- Mainboard -->
                    <div id="specMAINBOARD" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Socket <span class="text-danger">*</span></label>
                        <input type="text" name="socket" maxlength="30" class="form-control" placeholder="VD: LGA1700, AM5" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Chipset</label>
                        <input type="text" name="chipset" maxlength="30" class="form-control" placeholder="VD: Z790, B650" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Loại RAM <span class="text-danger">*</span></label>
                        <select name="mbRamType" class="form-select">
                          <option value="">-- Chọn --</option>
                          <option value="DDR4">DDR4</option>
                          <option value="DDR5">DDR5</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Số khe RAM</label>
                        <input type="number" name="ramSlots" class="form-control" min="1" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">RAM tối đa (GB)</label>
                        <input type="number" name="maxRamGb" class="form-control" min="1" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Form Factor <span class="text-danger">*</span></label>
                        <select name="mbFormFactor" class="form-select">
                          <option value="">-- Chọn --</option>
                          <option value="ATX">ATX</option>
                          <option value="MICRO_ATX">Micro-ATX</option>
                          <option value="MINI_ITX">Mini-ITX</option>
                          <option value="E_ATX">E-ATX</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Số khe M.2</label>
                        <input type="number" name="m2Slots" class="form-control" min="0" />
                      </div>
                    </div>

                    <!-- RAM -->
                    <div id="specRAM" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Loại RAM <span class="text-danger">*</span></label>
                        <select name="ramType" class="form-select">
                          <option value="">-- Chọn --</option>
                          <option value="DDR4">DDR4</option>
                          <option value="DDR5">DDR5</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Bus (MHz) <span class="text-danger">*</span></label>
                        <input type="number" name="speedMhz" class="form-control" min="1" placeholder="VD: 3200" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Dung lượng (GB) <span class="text-danger">*</span></label>
                        <input type="number" name="ramCapacityGb" class="form-control" min="1" placeholder="VD: 32" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Số thanh (Modules)</label>
                        <input type="number" name="modules" class="form-control" min="1" value="1" />
                      </div>
                    </div>

                    <!-- GPU -->
                    <div id="specGPU" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">VRAM (GB)</label>
                        <input type="number" name="vramGb" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Chiều dài (mm)</label>
                        <input type="number" name="lengthMm" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Đầu cấp nguồn</label>
                        <input type="text" name="powerConnector" maxlength="50" class="form-control" placeholder="VD: 8-pin, 16-pin" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">PSU khuyến nghị (W)</label>
                        <input type="number" name="recommendedPsuWatt" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Độ dày (số khe slot)</label>
                        <input type="number" name="slotWidth" class="form-control" min="1" value="2" />
                      </div>
                    </div>

                    <!-- PSU -->
                    <div id="specPSU" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Công suất (Watt) <span class="text-danger">*</span></label>
                        <input type="number" name="wattage" class="form-control" min="1" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Chuẩn hiệu suất</label>
                        <input type="text" name="efficiencyRating" maxlength="30" class="form-control" placeholder="VD: 80 Plus Gold" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Modular</label>
                        <select name="modular" class="form-select">
                          <option value="FULL">Full</option>
                          <option value="SEMI">Semi</option>
                          <option value="NONE">Non-modular</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Form Factor</label>
                        <select name="psuFormFactor" class="form-select">
                          <option value="ATX">ATX</option>
                          <option value="SFX">SFX</option>
                          <option value="SFX-L">SFX-L</option>
                        </select>
                      </div>
                    </div>

                    <!-- Case -->
                    <div id="specCASE_TYPE" class="row" style="display: none">
                      <div class="col-md-12 mb-2">
                        <label class="form-label">Hỗ trợ Form Factor <span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                          <div class="form-check">
                            <input type="checkbox" name="caseFormFactorSupport" value="ATX" class="form-check-input" id="caseAtx" />
                            <label class="form-check-label" for="caseAtx">ATX</label>
                          </div>
                          <div class="form-check">
                            <input type="checkbox" name="caseFormFactorSupport" value="MICRO_ATX" class="form-check-input" id="caseMatx" />
                            <label class="form-check-label" for="caseMatx">Micro-ATX</label>
                          </div>
                          <div class="form-check">
                            <input type="checkbox" name="caseFormFactorSupport" value="MINI_ITX" class="form-check-input" id="caseItx" />
                            <label class="form-check-label" for="caseItx">Mini-ITX</label>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">GPU dài tối đa (mm)</label>
                        <input type="number" name="maxGpuLengthMm" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Tản khí cao tối đa (mm)</label>
                        <input type="number" name="maxCoolerHeightMm" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Radiator tối đa (mm)</label>
                        <input type="number" name="maxRadiatorMm" class="form-control" min="0" />
                      </div>
                    </div>

                    <!-- Cooler -->
                    <div id="specCOOLER" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Loại tản nhiệt <span class="text-danger">*</span></label>
                        <select name="coolerType" class="form-select">
                          <option value="">-- Chọn --</option>
                          <option value="AIR">Khí (Air)</option>
                          <option value="AIO">Nước (AIO)</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Chiều cao - chỉ Tản khí (mm)</label>
                        <input type="number" name="heightMm" class="form-control" min="0" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Kích thước Radiator - chỉ AIO (mm)</label>
                        <input type="number" name="radiatorSizeMm" class="form-control" min="0" placeholder="VD: 240, 360" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Socket hỗ trợ</label>
                        <input type="text" name="socketSupport" maxlength="200" class="form-control" placeholder="VD: LGA1700,AM5" />
                      </div>
                    </div>

                    <!-- Storage -->
                    <div id="specSTORAGE" class="row" style="display: none">
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Loại ổ cứng <span class="text-danger">*</span></label>
                        <select name="storageType" class="form-select">
                          <option value="">-- Chọn --</option>
                          <option value="SSD_NVME">SSD NVMe</option>
                          <option value="SSD_SATA">SSD SATA</option>
                          <option value="HDD">HDD</option>
                        </select>
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Chuẩn giao tiếp</label>
                        <input type="text" name="storageInterface" maxlength="30" class="form-control" placeholder="VD: PCIe Gen4 x4, SATA III" />
                      </div>
                      <div class="col-md-4 mb-2">
                        <label class="form-label">Dung lượng (GB) <span class="text-danger">*</span></label>
                        <input type="number" name="storageCapacityGb" class="form-control" min="1" placeholder="VD: 1000" />
                      </div>
                    </div>
                  </div>

                  <div class="d-flex gap-2 justify-content-end border-top pt-3">
                    <a
                      th:href="@{/admin/products}"
                      class="btn btn-outline-secondary px-4"
                      >Hủy</a
                    >
                    <button
                      type="submit"
                      id="submitBtn"
                      class="btn btn-danger px-4 fw-semibold"
                    >
                      <i class="bi bi-check-lg me-1"></i>
                      <span
                        th:text="${product.productId == null ? 'Thêm Sản Phẩm' : 'Lưu Thay Đổi'}"
                        >Lưu</span
                      >
                    </button>
                  </div>
                </form>

                <script>
                  (function () {
                    var MAX_SIZE = 5 * 1024 * 1024; // 5MB
                    var fileInput = document.getElementById("imageFile");
                    var errorBox = document.getElementById("imageFileError");
                    var submitBtn = document.getElementById("submitBtn");

                    fileInput.addEventListener("change", function () {
                      errorBox.style.display = "none";
                      errorBox.textContent = "";
                      submitBtn.disabled = false;

                      var file = fileInput.files[0];
                      if (!file) return;

                      if (file.size > MAX_SIZE) {
                        errorBox.textContent =
                          "Ảnh vượt quá 5MB, vui lòng chọn ảnh khác.";
                        errorBox.style.display = "block";
                        fileInput.value = "";
                        submitBtn.disabled = false;
                      }
                    });
                  })();
                </script>

                <!-- Dữ liệu spec hiện có (dùng khi Sửa sản phẩm) để JS đổ lại vào form -->
                <script th:inline="javascript">
                  /*<![CDATA[*/
                  const specData = /*[[${spec}]]*/ {};
                  /*]]>*/
                </script>

                <!-- Script: hiện đúng block thông số theo danh mục đã chọn + pre-fill giá trị cũ khi Sửa -->
                <script>
                  document.addEventListener("DOMContentLoaded", function () {
                    const categorySelect = document.querySelector(
                      'select[name="categoryId"]',
                    );
                    if (!categorySelect) return;

                    const blockIds = [
                      "specNone",
                      "specPcProduct",
                      "specCPU",
                      "specMAINBOARD",
                      "specRAM",
                      "specGPU",
                      "specPSU",
                      "specCASE_TYPE",
                      "specCOOLER",
                      "specSTORAGE",
                    ];

                    function showBlock(id) {
                      blockIds.forEach(function (bid) {
                        const el = document.getElementById(bid);
                        if (el) {
                          const isVisible = (bid === id);
                          el.style.display = isVisible ? "" : "none";
                          const inputs = el.querySelectorAll("input, select, textarea");
                          inputs.forEach(input => {
                              input.disabled = !isVisible;
                          });
                        }
                      });
                    }

                    // Đổ dữ liệu specData (nếu có) vào input/select/checkbox tương ứng theo name.
                    // Chỉ chạy 1 lần lúc load trang Sửa - không đụng vào khi user tự đổi category sau đó.
                    function fillSpecData() {
                      if (!specData) return;
                      Object.keys(specData).forEach(function (key) {
                        const value = specData[key];
                        if (value === null || value === undefined) return;

                        if (key === "caseFormFactorSupport") {
                          if (!Array.isArray(value)) return;
                          document
                            .querySelectorAll('input[name="caseFormFactorSupport"]')
                            .forEach(function (cb) {
                              cb.checked = value.indexOf(cb.value) !== -1;
                            });
                          return;
                        }

                        const els = document.querySelectorAll(
                          '[name="' + key + '"]',
                        );
                        els.forEach(function (el) {
                          if (el.type === "checkbox") {
                            el.checked = value === true || value === "true";
                          } else {
                            el.value = value;
                          }
                        });
                      });
                    }

                    function updateSpecBlock() {
                      const opt =
                        categorySelect.options[categorySelect.selectedIndex];
                      if (!opt || !opt.value) {
                        showBlock("specNone");
                        return;
                      }
                      const catType = opt.getAttribute("data-cat-type");
                      const componentType = opt.getAttribute(
                        "data-component-type",
                      );

                      if (catType === "PC_PRODUCT") {
                        showBlock("specPcProduct");
                        return;
                      }
                      if (catType === "PC_COMPONENT" && componentType) {
                        showBlock("spec" + componentType);
                        return;
                      }
                      showBlock("specNone");
                    }

                    categorySelect.addEventListener(
                      "change",
                      updateSpecBlock,
                    );
                    updateSpecBlock(); // set đúng trạng thái ban đầu (kể cả khi Sửa sản phẩm)
                    fillSpecData(); // pre-fill giá trị cũ (no-op khi thêm mới vì specData rỗng)
                  });
                </script>

                <!-- Script Format VNĐ -->
                <script>
                  document.addEventListener("DOMContentLoaded", function () {
                    const priceInput = document.getElementById("basePrice");
                    const priceDisplay = document.getElementById(
                      "priceFormattedDisplay",
                    );

                    if (!priceInput || !priceDisplay) return;

                    function updatePriceDisplay() {
                      const val = parseInt(priceInput.value, 10);
                      if (!isNaN(val)) {
                        priceDisplay.textContent = new Intl.NumberFormat(
                          "vi-VN",
                          { style: "currency", currency: "VND" },
                        ).format(val);
                      } else {
                        priceDisplay.textContent = "";
                      }
                    }

                    priceInput.addEventListener("input", updatePriceDisplay);
                    updatePriceDisplay(); // initial load
                  });
                </script>

              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
