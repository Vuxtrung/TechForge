<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng - TechForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .container-fluid {
            padding-top: 20px;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: none;
        }
        .card-header {
            background-color: #1b1c1d;
            color: white;
            border-bottom: none;
        }
        .info-row {
            border-bottom: 1px solid #e9ecef;
            padding: 12px 0;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: #495057;
            width: 200px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            object-fit: cover;
            background-color: #e9ecef;
        }
        .badge-active {
            background-color: #28a745;
        }
        .badge-locked {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="main-body d-flex">
  <!-- Sidebar -->
  <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
  
  <!-- Main Content -->
  <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
    <div class="container-fluid">
    <div class="row mb-3">
        <div class="col-12">
            <a href="/admin/users" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>

    <div class="row">
        <!-- User Info Card -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-person"></i> Thông tin người dùng
                    </h5>
                </div>
                <div class="card-body">
                    <div class="row mb-4">
                        <div class="col-md-3 text-center">
                            <img th:if="${user.avatarUrl}" th:src="${user.avatarUrl}" alt="Avatar" class="avatar">
                            <div th:unless="${user.avatarUrl}" class="avatar d-flex align-items-center justify-content-center">
                                <i class="bi bi-person-fill" style="font-size: 3rem; color: #999;"></i>
                            </div>
                        </div>
                        <div class="col-md-9">
                            <h4 th:text="${user.fullName}"></h4>
                            <div class="mb-3">
                                <span th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).ACTIVE}" class="badge badge-active">
                                    <i class="bi bi-check-circle"></i> Hoạt động
                                </span>
                                <span th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).LOCKED}" class="badge badge-locked">
                                    <i class="bi bi-lock-fill"></i> Bị khóa
                                </span>
                                <span class="badge bg-info" th:text="${user.role.roleName}"></span>
                            </div>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Mã người dùng:</span>
                            <span th:text="${user.userId}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Email:</span>
                            <span th:text="${user.email}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Số điện thoại:</span>
                            <span th:text="${user.phone != null ? user.phone : '-'}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Phòng ban:</span>
                            <span th:text="${user.role.roleName}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Điểm thành viên:</span>
                            <span th:text="${user.loyaltyPoints}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Ngày tạo:</span>
                            <span th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
                        </div>
                    </div>

                    <div class="info-row">
                        <div class="d-flex justify-content-between">
                            <span class="info-label">Cập nhật lần cuối:</span>
                            <span th:text="${#temporals.format(user.updatedAt, 'dd/MM/yyyy HH:mm:ss')}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Card -->
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-gear"></i> Hành động
                    </h5>
                </div>
                <div class="card-body">
                    <th:block th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).ACTIVE and user.role.roleName != 'ADMIN'}">
                        <form th:action="@{/admin/users/{id}/lock(id=${user.userId})}" method="post" class="mb-3">
                            <button type="submit" class="btn btn-danger w-100"
                                    onclick="return confirm('Bạn chắc chắn muốn khóa tài khoản này?')">
                                <i class="bi bi-lock"></i> Khóa tài khoản
                            </button>
                        </form>
                    </th:block>
                    <th:block th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).LOCKED}">
                        <form th:action="@{/admin/users/{id}/unlock(id=${user.userId})}" method="post" class="mb-3">
                            <button type="submit" class="btn btn-success w-100"
                                    onclick="return confirm('Bạn chắc chắn muốn mở khóa tài khoản này?')">
                                <i class="bi bi-unlock"></i> Mở khóa tài khoản
                            </button>
                        </form>
                    </th:block>

                    <a href="/admin/users" class="btn btn-secondary w-100">
                        <i class="bi bi-arrow-left"></i> Quay lại danh sách
                    </a>
                </div>
            </div>

            <!-- Status Info Card -->
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="bi bi-info-circle"></i> Thông tin trạng thái
                    </h5>
                </div>
                <div class="card-body">
                    <div th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).ACTIVE}" class="alert alert-success mb-0">
                        <i class="bi bi-check-circle"></i> Tài khoản đang hoạt động bình thường
                    </div>
                    <div th:if="${user.status == T(com.swp391.techforge.entity.UserStatus).LOCKED}" class="alert alert-danger mb-0">
                        <i class="bi bi-lock-fill"></i> Tài khoản đã bị khóa. Người dùng không thể đăng nhập
                    </div>
                </div>
            </div>
        </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
