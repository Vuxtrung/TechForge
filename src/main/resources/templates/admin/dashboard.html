<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title>Admin Dashboard</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="main-body container-fluid px-lg-5 my-4">
    <div class="bg-white rounded-3 shadow-sm border p-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div>
                <div class="text-muted small text-uppercase">TechForge</div>
                <h3 class="fw-bold mb-0 text-dark">Admin Dashboard</h3>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6 col-xl-3">
                <a th:href="@{/admin/users}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <p class="text-muted small mb-1">Người dùng</p>
                                    <h5 class="fw-bold mb-0 text-dark">Quản lý Users</h5>
                                </div>
                                <div class="bg-primary bg-opacity-10 text-primary rounded-circle p-3">
                                    <i class="bi bi-people fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-xl-3">
                <a th:href="@{/admin/products}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <p class="text-muted small mb-1">Sản phẩm</p>
                                    <h5 class="fw-bold mb-0 text-dark">Quản lý Products</h5>
                                </div>
                                <div class="bg-danger bg-opacity-10 text-danger rounded-circle p-3">
                                    <i class="bi bi-box-seam fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-xl-3">
                <a th:href="@{/admin/categories}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <p class="text-muted small mb-1">Danh mục</p>
                                    <h5 class="fw-bold mb-0 text-dark">Quản lý Categories</h5>
                                </div>
                                <div class="bg-success bg-opacity-10 text-success rounded-circle p-3">
                                    <i class="bi bi-tags fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-xl-3">
                <a th:href="@{/admin/warranty}" class="text-decoration-none">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <p class="text-muted small mb-1">Bảo hành</p>
                                    <h5 class="fw-bold mb-0 text-dark">Warranty Tickets</h5>
                                </div>
                                <div class="bg-warning bg-opacity-10 text-warning rounded-circle p-3">
                                    <i class="bi bi-shield-check fs-4"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
