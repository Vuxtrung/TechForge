<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title th:text="${voucher.voucherId == null ? 'Thêm Voucher' : 'Sửa Voucher'}">Voucher</title>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

      <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px)">
        <div class="container-fluid">
          <div class="row justify-content-center">
            <div class="col-lg-9">
              <div class="bg-white rounded-3 shadow-sm border p-4">
                <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                  <span class="fs-4 text-dark fw-bold">
                    <i class="bi bi-ticket-perforated text-danger"></i>
                    <span th:text="${voucher.voucherId == null ? 'Thêm Voucher Mới' : 'Cập Nhật Voucher'}">Voucher</span>
                  </span>
                  <a th:href="@{/admin/vouchers}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Quay Lại Danh Sách
                  </a>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger">
                  <i class="bi bi-exclamation-triangle me-1"></i>
                  <span th:text="${errorMessage}"></span>
                </div>

                <!-- Thông tin lượt dùng: chỉ readonly, tính từ voucher_usages, không cho sửa tay -->
                <div th:if="${voucher.voucherId != null}" class="alert alert-light border d-flex align-items-center gap-2">
                  <i class="bi bi-info-circle"></i>
                  Đã sử dụng: <strong th:text="${usedCount}">0</strong>
                  / <span th:text="${voucher.usageLimit != null ? voucher.usageLimit : 'không giới hạn'}">100</span> lượt (toàn hệ thống)
                </div>

                <form
                  th:action="${voucher.voucherId == null ? '/admin/vouchers' : '/admin/vouchers/' + voucher.voucherId}"
                  th:object="${voucher}"
                  method="post"
                  novalidate
                >
                  <input type="hidden" th:field="*{voucherId}" />

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Mã Voucher <span class="text-danger">*</span></label>
                      <input type="text" th:field="*{code}" class="form-control text-uppercase"
                        th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                        placeholder="VD: GIAM10" required maxlength="50" />
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Loại Giảm Giá <span class="text-danger">*</span></label>
                      <select th:field="*{discountType}" class="form-select" required>
                        <option value="">-- Chọn loại --</option>
                        <option value="PERCENT">Phần trăm (%)</option>
                        <option value="FIXED_AMOUNT">Số tiền cố định (đ)</option>
                        <option value="COMBO_GIFT">Tặng quà kèm</option>
                      </select>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label fw-semibold">Mô Tả</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"
                      placeholder="VD: Giảm 10% cho mọi đơn hàng" maxlength="255"></textarea>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold" id="discountValueLabel">Giá Trị Giảm <span class="text-danger">*</span></label>
                      <input type="number" step="0.01" min="0" th:field="*{discountValue}" class="form-control"
                        th:classappend="${#fields.hasErrors('discountValue')} ? 'is-invalid'" />
                      <div class="form-text" id="discountValueHint">PERCENT: nhập 0-100 (%). FIXED_AMOUNT: nhập số tiền (đ). COMBO_GIFT: để 0.</div>
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Giá Trị Đơn Hàng Tối Thiểu</label>
                      <input type="number" step="0.01" min="0" th:field="*{minOrderValue}" class="form-control" placeholder="0" />
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Thời Gian Bắt Đầu <span class="text-danger">*</span></label>
                      <input type="datetime-local" th:field="*{startDate}" class="form-control"
                        th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'" required />
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Thời Gian Kết Thúc <span class="text-danger">*</span></label>
                      <input type="datetime-local" th:field="*{endDate}" class="form-control"
                        th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'" required />
                      <div class="invalid-feedback" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
                    </div>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Số Lượt Sử Dụng Tối Đa</label>
                      <input type="number" min="0" th:field="*{usageLimit}" class="form-control" placeholder="Để trống = không giới hạn" />
                      <div class="form-text">Tổng số lượt được dùng, tính toàn hệ thống (không phải theo từng khách).</div>
                    </div>

                    <div class="col-md-6 mb-3">
                      <label class="form-label fw-semibold">Giới Hạn Lượt Dùng / Khách Hàng <span class="text-danger">*</span></label>
                      <input type="number" min="1" th:field="*{maxUsagePerCustomer}" class="form-control" />
                      <div class="form-text">Mỗi khách hàng được dùng voucher này tối đa bao nhiêu lần.</div>
                    </div>
                  </div>

                  <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" th:field="*{isActive}" role="switch" id="activeSwitch" />
                    <label class="form-check-label fw-semibold" for="activeSwitch">Kích hoạt voucher này</label>
                  </div>

                  <div class="d-flex gap-2 justify-content-end border-top pt-3">
                    <a th:href="@{/admin/vouchers}" class="btn btn-outline-secondary px-4">Hủy</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                      <i class="bi bi-check-lg me-1"></i>
                      <span th:text="${voucher.voucherId == null ? 'Thêm Voucher' : 'Lưu Thay Đổi'}">Lưu</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
      // Ẩn/khóa field Giá Trị Giảm khi chọn COMBO_GIFT vì loại này không giảm tiền
      // trực tiếp (Service cho phép discountValue = 0 riêng cho COMBO_GIFT).
      (function () {
        const typeSelect = document.querySelector('select[name="discountType"]');
        const valueInput = document.querySelector('input[name="discountValue"]');
        const hint = document.getElementById('discountValueHint');

        function syncDiscountValue() {
          if (typeSelect.value === 'COMBO_GIFT') {
            valueInput.value = 0;
            valueInput.setAttribute('readonly', 'readonly');
            hint.textContent = 'Loại Tặng quà không giảm tiền trực tiếp, giá trị được cố định = 0.';
          } else {
            valueInput.removeAttribute('readonly');
            if (typeSelect.value === 'PERCENT') {
              hint.textContent = 'Nhập giá trị phần trăm giảm, từ 0 đến 100.';
            } else {
              hint.textContent = 'Nhập số tiền giảm cố định (VNĐ).';
            }
          }
        }

        typeSelect.addEventListener('change', syncDiscountValue);
        syncDiscountValue();
      })();
    </script>
  </body>
</html>
