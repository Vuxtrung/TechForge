<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Nhân viên - TechForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f5f5f5; }
        .card { box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); border: none; }
        .card-header { background-color: #0b0b0c; color: white; }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="main-body d-flex">
  <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
  
  <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="bi bi-person-plus"></i> Thêm Nhân viên mới
                        </h5>
                        <a th:href="@{/admin/staff}" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-arrow-left"></i> Quay lại
                        </a>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/admin/staff/add}" th:object="${staffCreateRequest}" method="post">
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="fullName" class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Nhập họ và tên">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@techforge.com">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="password" class="form-label fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label fw-bold">Số điện thoại</label>
                                    <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="Nhập số điện thoại">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="roleId" class="form-label fw-bold">Vai trò <span class="text-danger">*</span></label>
                                <select class="form-select" id="roleId" th:field="*{roleId}">
                                    <option value="" disabled selected>-- Chọn vai trò nhân viên --</option>
                                    <option th:each="role : ${staffRoles}" 
                                            th:value="${role.roleId}" 
                                            th:text="${role.roleName}"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-dark">
                                    <i class="bi bi-save"></i> Lưu thông tin
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
