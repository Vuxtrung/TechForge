<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đánh giá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="d-flex" style="min-height: calc(100vh - 72px);">
    <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>

    <div class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Quản lý Đánh giá Sản phẩm</h4>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Khách hàng</th>
                        <th scope="col">Sản phẩm</th>
                        <th scope="col" class="text-center">Số sao</th>
                        <th scope="col" style="width: 35%;">Nội dung</th>
                        <th scope="col">Ngày tạo</th>
                        <th scope="col" class="text-center">Hành động</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="review : ${reviewPage.content}">
                        <td class="fw-semibold" th:text="${review.user.fullName}">Nguyễn Văn A</td>
                        <td>
                            <a th:href="@{'/products/' + ${review.product.productId}}" target="_blank" class="text-decoration-none text-dark fw-semibold" th:text="${review.product.name}"></a>
                        </td>
                        <td class="text-center text-warning fs-8">
                            <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                <i th:class="${i <= review.rating ? 'bi bi-star-fill' : 'bi bi-star'}"></i>
                            </th:block>
                        </td>
                        <td class="text-muted fs-8" th:text="${review.comment}"></td>
                        <td th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-center">
                            <form th:action="@{'/admin/reviews/' + ${review.reviewId} + '/delete'}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Bạn có chắc chắn muốn xóa đánh giá này?')">
                                    <i class="bi bi-trash"></i> Xóa
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${reviewPage.empty}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i> Chưa có đánh giá nào.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="card-footer bg-white py-3 border-0" th:if="${reviewPage.totalPages > 1}">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${!reviewPage.hasPrevious()} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/reviews(page=${reviewPage.number - 1}, size=${reviewPage.size})}">Trước</a>
                        </li>
                        <th:block th:each="i : ${#numbers.sequence(0, reviewPage.totalPages - 1)}">
                            <li class="page-item" th:classappend="${i == reviewPage.number} ? 'active'">
                                <a class="page-link" th:href="@{/admin/reviews(page=${i}, size=${reviewPage.size})}" th:text="${i + 1}">1</a>
                            </li>
                        </th:block>
                        <li class="page-item" th:classappend="${!reviewPage.hasNext()} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/reviews(page=${reviewPage.number + 1}, size=${reviewPage.size})}">Sau</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
