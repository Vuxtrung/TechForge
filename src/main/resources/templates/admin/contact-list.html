<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8" />
    <title>Quản Lý Liên Hệ - TechForge</title>
  </head>

  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
      
      <!-- Main Content -->
      <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid">
          <div class="bg-white rounded-3 shadow-sm border p-4">
            
            <!-- Page Title -->
            <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
              <span class="fs-4 text-dark fw-bold">
                <i class="bi bi-envelope-paper text-danger me-2"></i> Quản Lý Liên Hệ Người Dùng
              </span>
            </div>

            <!-- Flash messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
              <i class="bi bi-check-circle me-1"></i>
              <span th:text="${successMessage}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle me-1"></i>
              <span th:text="${errorMessage}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search form -->
            <form th:action="@{/admin/contacts}" method="get" class="row g-2 align-items-end mb-3">
              <div class="col-md-8">
                <label class="form-label fs-8 text-muted mb-1">Tìm kiếm</label>
                <input type="search" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, email hoặc tiêu đề..." />
              </div>
              <div class="col-md-2 d-flex gap-2">
                <button type="submit" class="btn btn-dark w-100 fw-semibold">
                  <i class="bi bi-funnel me-1"></i> Lọc
                </button>
              </div>
              <div class="col-md-2">
                <a th:href="@{/admin/contacts}" class="btn btn-outline-secondary w-100" title="Xóa bộ lọc">
                  <i class="bi bi-x-lg"></i> Reset
                </a>
              </div>
            </form>

            <!-- Contact table -->
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-dark">
                  <tr>
                    <th scope="col" style="width: 60px">#</th>
                    <th scope="col">Tên</th>
                    <th scope="col">Email</th>
                    <th scope="col">Tiêu đề</th>
                    <th scope="col">Nội dung</th>
                    <th scope="col">Ngày gửi</th>
                    <th scope="col" class="text-end">Thao tác</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:if="${contactPage.empty}">
                    <td colspan="7" class="text-center text-muted py-4">
                      Không tìm thấy thông tin liên hệ nào.
                    </td>
                  </tr>
                  <tr th:each="contact, iter : ${contactPage.content}">
                    <td th:text="${contactPage.number * contactPage.size + iter.index + 1}">1</td>
                    <td>
                      <span class="fw-semibold text-dark" th:text="${contact.fullName}">Tên khách</span>
                    </td>
                    <td th:text="${contact.email}">email@example.com</td>
                    <td class="fw-medium" th:text="${contact.subject}">Tiêu đề</td>
                    <td class="text-wrap" style="max-width: 300px;" th:text="${contact.message}">Nội dung liên hệ</td>
                    <td th:text="${#temporals.format(contact.createdAt, 'dd/MM/yyyy HH:mm')}">Ngày gửi</td>
                    <td class="text-end">
                      <a th:href="@{/admin/contacts/{id}(id=${contact.id})}" class="btn btn-outline-primary btn-sm" title="Xem chi tiết">
                        <i class="bi bi-eye"></i>
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${contactPage.totalPages > 1}" aria-label="Contact pagination">
              <ul class="pagination justify-content-center mb-0">
                <li class="page-item" th:classappend="${contactPage.first} ? 'disabled'">
                  <a class="page-link" th:href="@{/admin/contacts(page=${contactPage.number - 1}, keyword=${keyword})}">
                    <i class="bi bi-chevron-left"></i>
                  </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, contactPage.totalPages - 1)}"
                    th:classappend="${i == contactPage.number} ? 'active'">
                  <a class="page-link" th:href="@{/admin/contacts(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${contactPage.last} ? 'disabled'">
                  <a class="page-link" th:href="@{/admin/contacts(page=${contactPage.number + 1}, keyword=${keyword})}">
                    <i class="bi bi-chevron-right"></i>
                  </a>
                </li>
              </ul>
            </nav>

          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
