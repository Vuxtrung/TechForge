<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Chi Tiết Liên Hệ - TechForge</title>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-body d-flex">
      <!-- Sidebar -->
      <div th:replace="~{fragments/admin-sidebar :: sidebar}"></div>
      
      <!-- Main Content -->
      <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="bg-white rounded-3 shadow-sm border p-4">

                        <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                            <span class="fs-4 text-dark fw-bold">
                                <i class="bi bi-envelope-open text-danger me-2"></i>
                                Chi Tiết Thông Tin Liên Hệ & Phản Hồi
                            </span>
                            <a th:href="@{/admin/contacts}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i> Quay Lại Danh Sách
                            </a>
                        </div>

                        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle me-1"></i> <span th:text="${successMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted d-block">Trạng thái</label>
                            <span th:switch="${contact.status.name()}">
                                <span th:case="'PENDING'" class="badge bg-warning text-dark fs-6">Đợi phản hồi</span>
                                <span th:case="'REPLIED'" class="badge bg-success fs-6">Đã phản hồi</span>
                                <span th:case="'HIDDEN'" class="badge bg-secondary fs-6">Đã ẩn</span>
                            </span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Họ và tên khách hàng</label>
                            <input type="text" class="form-control" th:value="${contact.fullName}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Email liên hệ</label>
                            <input type="email" class="form-control" th:value="${contact.email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Tiêu đề</label>
                            <input type="text" class="form-control" th:value="${contact.subject}" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Nội dung tin nhắn từ khách hàng</label>
                            <textarea class="form-control" rows="4" readonly th:text="${contact.message}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold text-muted">Thời gian gửi</label>
                            <input type="text" class="form-control" th:value="${#temporals.format(contact.createdAt, 'dd/MM/yyyy HH:mm:ss')}" readonly>
                        </div>

                        <div class="mb-4" th:if="${contact.repliedAt != null}">
                            <label class="form-label fw-semibold text-muted">Thời gian phản hồi gần nhất</label>
                            <input type="text" class="form-control" th:value="${#temporals.format(contact.repliedAt, 'dd/MM/yyyy HH:mm:ss')}" readonly>
                        </div>

                        <div class="border-top pt-3 mb-4">
                            <label for="replyMessage" class="form-label fw-semibold text-danger">
                                <i class="bi bi-reply-fill me-1"></i> Soạn nội dung phản hồi gửi qua email
                            </label>
                            <textarea form="replyForm" name="replyMessage" id="replyMessage" class="form-control mb-3" rows="5"
                                      placeholder="Nhập nội dung trả lời khách hàng..." required></textarea>

                            <div class="d-flex justify-content-between align-items-center">
                                <form th:action="@{/admin/contacts/{id}/toggle-hidden(id=${contact.id})}" method="post" class="m-0"
                                      th:attr="onsubmit=${contact.status.name() == 'HIDDEN'} ? null : 'return confirm(\'Bạn có chắc chắn muốn ẩn liên hệ này không?\');'">
                                    <button type="submit"
                                            th:class="${contact.status.name() == 'HIDDEN'} ? 'btn btn-outline-success px-4' : 'btn btn-outline-danger px-4'">
                                        <i th:class="${contact.status.name() == 'HIDDEN'} ? 'bi bi-eye-fill me-1' : 'bi bi-eye-slash me-1'"></i>
                                        <span th:text="${contact.status.name() == 'HIDDEN'} ? 'Hiện Lại Liên Hệ' : 'Ẩn Liên Hệ'"></span>
                                    </button>
                                </form>

                                <form id="replyForm" th:action="@{/admin/contacts/{id}/reply(id=${contact.id})}" method="post" class="m-0">
                                    <button type="submit" class="btn btn-danger px-4 fw-semibold">
                                        <i class="bi bi-send-fill me-1"></i> Gửi Phản Hồi Ngay
                                    </button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
