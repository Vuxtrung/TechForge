<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"><title>Chi tiết bảo hành - TechForge</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body d-flex"><div th:replace="~{fragments/staff-sidebar :: sidebar}"></div><div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
    <div class="d-flex justify-content-between align-items-center mb-4"><div><a th:href="@{/staff/warranty}" class="text-decoration-none text-muted small">Danh sách bảo hành</a><h1 class="h3 mb-0 mt-1">Chi tiết phiếu bảo hành</h1></div><span class="badge bg-primary fs-6" th:text="${ticket.status}"></span></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="row g-4"><div class="col-lg-7"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5 border-bottom pb-2 mb-3">Thông tin phiếu</h2><div class="row g-3"><div class="col-md-6"><small class="text-muted d-block">Mã phiếu</small><strong th:text="${ticket.ticketId}"></strong></div><div class="col-md-6"><small class="text-muted d-block">Ngày tiếp nhận</small><span th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}"></span></div><div class="col-md-6"><small class="text-muted d-block">Khách hàng</small><strong th:text="${ticket.user.fullName}"></strong></div><div class="col-md-6"><small class="text-muted d-block">Email</small><span th:text="${ticket.user.email}"></span></div><div class="col-md-6"><small class="text-muted d-block">IMEI / Serial</small><strong th:text="${ticket.imeiSerial}"></strong></div><div class="col-md-6"><small class="text-muted d-block">Số điện thoại</small><span th:text="${ticket.phoneLookup != null ? ticket.phoneLookup : '-'}"></span></div><div class="col-12"><small class="text-muted d-block">Mô tả lỗi</small><div class="border rounded p-3 bg-light" th:text="${ticket.issueDesc != null ? ticket.issueDesc : 'Không có mô tả'}"></div></div></div></div></div></div><div class="col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body"><h2 class="h5 border-bottom pb-2 mb-3">Cập nhật xử lý</h2><form th:action="@{/staff/warranty/{id}/update(id=${ticket.ticketId})}" method="post"><label class="form-label">Trạng thái</label><select name="status" class="form-select mb-3" required><option th:each="itemStatus : ${statuses}" th:value="${itemStatus.name()}" th:text="${itemStatus.name()}" th:selected="${ticket.status == itemStatus}"></option></select><label class="form-label">Nhân viên phụ trách</label><select name="assignedStaffId" class="form-select mb-3"><option value="">Giữ nguyên</option><option th:each="staff : ${staffMembers}" th:value="${staff.userId}" th:text="${staff.fullName}" th:selected="${ticket.assignedStaff != null and ticket.assignedStaff.userId == staff.userId}"></option></select><button class="btn btn-primary w-100" type="submit"><i class="bi bi-save me-1"></i>Lưu cập nhật</button></form></div></div></div></div>
</div></main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
