<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"><title>Dashboard nhân viên - TechForge</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body d-flex">
    <div th:replace="~{fragments/staff-sidebar :: sidebar}"></div>
    <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid">
            <div class="mb-4"><h1 class="h3 mb-1">Dashboard nhân viên</h1><p class="text-muted mb-0">Tổng quan hoạt động đơn hàng và bảo hành</p></div>
            <div class="row g-4">
                <div class="col-md-6" th:if="${salesStaff}"><div class="card border-0 shadow-sm h-100"><div class="card-body d-flex justify-content-between"><div><div class="text-muted small">Tổng đơn hàng</div><div class="display-6 fw-bold" th:text="${orderCount}">0</div></div><i class="bi bi-receipt-cutoff fs-1 text-primary"></i></div><div class="card-footer bg-white border-0"><a th:href="@{/staff/orders}" class="btn btn-primary w-100">Xem danh sách đơn hàng</a></div></div></div>
                <div class="col-md-6" th:if="${warrantyStaff}"><div class="card border-0 shadow-sm h-100"><div class="card-body d-flex justify-content-between"><div><div class="text-muted small">Tổng phiếu bảo hành</div><div class="display-6 fw-bold" th:text="${warrantyCount}">0</div></div><i class="bi bi-shield-check fs-1 text-success"></i></div><div class="card-footer bg-white border-0"><a th:href="@{/staff/warranty}" class="btn btn-success w-100">Xem danh sách bảo hành</a></div></div></div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
