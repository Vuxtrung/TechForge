<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"><title>Tiếp nhận bảo hành - TechForge</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body d-flex">
    <div th:replace="~{fragments/staff-sidebar :: sidebar}"></div>
    <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="container-fluid"><div class="mb-4"><a th:href="@{/staff/warranty}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Danh sách bảo hành</a><h1 class="h3 mt-1">Tiếp nhận sản phẩm tại cửa hàng</h1><p class="text-muted mb-0">Tạo phiếu bảo hành khi khách mang sản phẩm trực tiếp đến showroom.</p></div>
            <div class="card border-0 shadow-sm"><div class="card-body p-4">
                <form th:action="@{/staff/warranty/receive}" method="post" class="row g-3">
                    <div class="col-md-6"><label class="form-label fw-semibold">Khách hàng <span class="text-danger">*</span></label><select name="userId" class="form-select" required><option value="">-- Chọn khách hàng --</option><option th:each="customer : ${customers}" th:value="${customer.userId}" th:text="${customer.fullName + ' - ' + customer.email}"></option></select></div>
                    <div class="col-md-6"><label class="form-label fw-semibold">IMEI / Serial <span class="text-danger">*</span></label><input name="imeiSerial" class="form-control" required maxlength="100" placeholder="Nhập IMEI hoặc Serial sản phẩm"></div>
                    <div class="col-md-6"><label class="form-label">Số điện thoại</label><input name="phoneLookup" class="form-control" maxlength="20" placeholder="Số điện thoại liên hệ"></div>
                    <div class="col-md-6"><label class="form-label">Order Item ID</label><input name="orderItemId" type="number" class="form-control" placeholder="Để trống nếu khách mang trực tiếp"></div>
                    <div class="col-12"><label class="form-label">Mô tả sự cố</label><textarea name="issueDesc" class="form-control" rows="5" maxlength="2000" placeholder="Mô tả tình trạng sản phẩm khi tiếp nhận"></textarea></div>
                    <div class="col-12 d-flex justify-content-end gap-2"><a th:href="@{/staff/warranty}" class="btn btn-outline-secondary">Hủy</a><button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i>Tạo phiếu bảo hành</button></div>
                </form>
            </div></div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
