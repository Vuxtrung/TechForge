<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"><title>Quản lý bảo hành - TechForge</title></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body d-flex">
    <div th:replace="~{fragments/staff-sidebar :: sidebar}"></div>
    <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-0 mt-1">Danh sách phiếu bảo hành</h1></div><a th:href="@{/staff/warranty/new}" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Tiếp nhận tại cửa hàng</a></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div class="card border-0 shadow-sm"><div class="card-body">
            <form th:action="@{/staff/warranty}" method="get" class="row g-2 align-items-end mb-4"><div class="col-md-5"><label class="form-label">Tìm kiếm</label><input name="keyword" class="form-control" th:value="${keyword}" placeholder="Tên khách, email, IMEI, mô tả lỗi"></div><div class="col-md-3"><label class="form-label">Trạng thái</label><select name="status" class="form-select"><option value="">Tất cả</option><option th:each="itemStatus : ${statuses}" th:value="${itemStatus.name()}" th:text="${itemStatus.name()}" th:selected="${status == itemStatus.name()}"></option></select></div><div class="col-md-2"><label class="form-label">Sắp xếp</label><select name="sort" class="form-select"><option value="createdAt,desc">Mới nhất</option><option value="createdAt,asc">Cũ nhất</option></select></div><div class="col-md-2 d-flex gap-2"><button class="btn btn-dark flex-grow-1" type="submit"><i class="bi bi-search"></i></button><a th:href="@{/staff/warranty}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a></div></form>
            <div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>#</th><th>Khách hàng</th><th>IMEI / Serial</th><th>Nhân viên</th><th>Trạng thái</th><th>Ngày tiếp nhận</th><th></th></tr></thead><tbody><tr th:each="ticket, row : ${ticketPage.content}"><td th:text="${ticketPage.number * ticketPage.size + row.index + 1}"></td><td><strong th:text="${ticket.user.fullName}"></strong><small class="d-block text-muted" th:text="${ticket.user.email}"></small></td><td th:text="${ticket.imeiSerial}"></td><td th:text="${ticket.assignedStaff != null ? ticket.assignedStaff.fullName : 'Chưa phân công'}"></td><td><span class="badge bg-primary" th:text="${ticket.status}"></span></td><td th:text="${#temporals.format(ticket.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td><a th:href="@{/staff/warranty/{id}(id=${ticket.ticketId})}" class="btn btn-outline-primary btn-sm"><i class="bi bi-eye"></i></a></td></tr><tr th:if="${ticketPage.empty}"><td colspan="7" class="text-center text-muted py-4">Chưa có phiếu bảo hành nào.</td></tr></tbody></table></div>
            <nav th:if="${ticketPage.totalPages > 1}" aria-label="Phân trang phiếu bảo hành"><ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!ticketPage.hasPrevious()} ? 'disabled'"><a class="page-link" th:if="${ticketPage.hasPrevious()}" th:href="@{/staff/warranty(page=0, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-double-left"></i></a><span class="page-link" th:unless="${ticketPage.hasPrevious()}"><i class="bi bi-chevron-double-left"></i></span></li>
                <li class="page-item" th:classappend="${!ticketPage.hasPrevious()} ? 'disabled'"><a class="page-link" th:if="${ticketPage.hasPrevious()}" th:href="@{/staff/warranty(page=${ticketPage.number - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-left"></i></a><span class="page-link" th:unless="${ticketPage.hasPrevious()}"><i class="bi bi-chevron-left"></i></span></li>
                <li class="page-item" th:classappend="${ticketPage.number == 0} ? 'active'"><a class="page-link" th:if="${ticketPage.number != 0}" th:href="@{/staff/warranty(page=0, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}">1</a><span class="page-link" th:if="${ticketPage.number == 0}">1</span></li>
                <li class="page-item disabled" th:if="${ticketPage.number > 2}"><span class="page-link">...</span></li>
                <th:block th:with="start=${T(java.lang.Math).max(1, ticketPage.number - 1)}, end=${T(java.lang.Math).min(ticketPage.totalPages - 2, ticketPage.number + 1)}"><th:block th:if="${start <= end}" th:each="i : ${#numbers.sequence(start, end)}"><li class="page-item" th:classappend="${i == ticketPage.number} ? 'active'"><a class="page-link" th:if="${i != ticketPage.number}" th:href="@{/staff/warranty(page=${i}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}" th:text="${i + 1}"></a><span class="page-link" th:if="${i == ticketPage.number}" th:text="${i + 1}"></span></li></th:block></th:block>
                <li class="page-item disabled" th:if="${ticketPage.number < ticketPage.totalPages - 3}"><span class="page-link">...</span></li>
                <li class="page-item" th:classappend="${ticketPage.last} ? 'active'"><a class="page-link" th:if="${!ticketPage.last}" th:href="@{/staff/warranty(page=${ticketPage.totalPages - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}" th:text="${ticketPage.totalPages}"></a><span class="page-link" th:if="${ticketPage.last}" th:text="${ticketPage.totalPages}"></span></li>
                <li class="page-item" th:classappend="${!ticketPage.hasNext()} ? 'disabled'"><a class="page-link" th:if="${ticketPage.hasNext()}" th:href="@{/staff/warranty(page=${ticketPage.number + 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-right"></i></a><span class="page-link" th:unless="${ticketPage.hasNext()}"><i class="bi bi-chevron-right"></i></span></li>
                <li class="page-item" th:classappend="${!ticketPage.hasNext()} ? 'disabled'"><a class="page-link" th:if="${ticketPage.hasNext()}" th:href="@{/staff/warranty(page=${ticketPage.totalPages - 1}, size=${size}, keyword=${keyword}, status=${status}, sort=${sort})}"><i class="bi bi-chevron-double-right"></i></a><span class="page-link" th:unless="${ticketPage.hasNext()}"><i class="bi bi-chevron-double-right"></i></span></li>
            </ul></nav>
        </div></div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body></html>
