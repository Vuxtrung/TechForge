<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <title>Chi tiết đơn hàng - TechForge</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="main-body d-flex">
    <div th:replace="~{fragments/staff-sidebar :: sidebar}"></div>
    <div class="content flex-grow-1 p-4 bg-light" style="min-height: calc(100vh - 72px);">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/staff/dashboard}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i>Dashboard</a>
                <span class="text-muted mx-2">/</span>
                <a th:href="@{/staff/orders}" class="text-decoration-none text-muted small">Danh sách đơn hàng</a>
                <h1 class="h3 mb-0 mt-1" th:text="'Chi tiết đơn hàng #' + ${order.orderId}">Chi tiết đơn hàng</h1>
            </div>
            <span class="badge bg-primary fs-6" th:text="${order.status}"></span>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="h5 border-bottom pb-2 mb-3">Sản phẩm trong đơn</h2>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light"><tr><th>Sản phẩm</th><th class="text-center">Đơn giá</th><th class="text-center">SL</th><th class="text-end">Thành tiền</th></tr></thead>
                                <tbody>
                                <tr th:each="item : ${order.orderItems}">
                                    <td th:text="${item.productName}"></td>
                                    <td class="text-center" th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                                    <td class="text-center" th:text="${item.quantity}"></td>
                                    <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(order.orderItems)}"><td colspan="4" class="text-center text-muted">Đơn hàng chưa có sản phẩm.</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 border-bottom pb-2 mb-3">Thông tin giao hàng</h2>
                        <dl class="row mb-0">
                            <dt class="col-sm-4">Người nhận</dt><dd class="col-sm-8" th:text="${order.recipientName}"></dd>
                            <dt class="col-sm-4">Số điện thoại</dt><dd class="col-sm-8" th:text="${order.phone}"></dd>
                            <dt class="col-sm-4">Email</dt><dd class="col-sm-8" th:text="${order.email}"></dd>
                            <dt class="col-sm-4">Địa chỉ</dt><dd class="col-sm-8" th:text="${order.shippingAddress}"></dd>
                            <dt class="col-sm-4">Phương thức giao</dt><dd class="col-sm-8" th:text="${order.shippingMethod}"></dd>
                            <dt class="col-sm-4">Ghi chú</dt><dd class="col-sm-8" th:text="${order.orderNote != null ? order.orderNote : '-'}"></dd>
                        </dl>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h2 class="h5 border-bottom pb-2 mb-3">Cập nhật đơn hàng</h2>
                        <form th:action="@{/staff/orders/{id}/status(id=${order.orderId})}" method="post">
                            <label class="form-label">Trạng thái</label>
                            <select name="status" class="form-select mb-3" required>
                                <option th:each="itemStatus : ${orderStatuses}" th:value="${itemStatus.name()}" th:text="${itemStatus.name()}" th:selected="${order.status == itemStatus}"></option>
                            </select>
                            <button class="btn btn-primary w-100" type="submit"><i class="bi bi-save me-1"></i>Lưu trạng thái</button>
                        </form>
                    </div>
                </div>
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 border-bottom pb-2 mb-3">Thanh toán</h2>
                        <div class="d-flex justify-content-between mb-2"><span>Phương thức</span><strong th:text="${order.payment != null ? order.payment.method : 'COD'}"></strong></div>
                        <div class="d-flex justify-content-between mb-2"><span>Trạng thái</span><strong th:text="${order.payment != null ? order.payment.status : 'PENDING'}"></strong></div>
                        <div class="d-flex justify-content-between border-top pt-3 mt-3"><span class="fw-bold">Tổng tiền</span><strong class="text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></strong></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
