<!DOCTYPE html>

<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Tự Build PC - TechForge</title>
</head>

<body class="bg-light text-dark min-vh-100 d-flex flex-column">
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- Main Content -->
    <main class="flex-grow-1 container-xl py-4 d-flex flex-column flex-md-row gap-4">
        <!-- Left Column: Component Categories -->
        <aside class="flex-shrink-0" style="width: 100%; max-width: 280px;">
            <div class="bg-white rounded border shadow-sm overflow-hidden">
                <div class="bg-dark text-white px-3 py-2 d-flex align-items-center justify-content-between fw-bold text-uppercase fs-6">
                    <span>Linh Kiện</span>
                    <i class="bi bi-pc-display fs-6"></i>
                </div>
                <div class="d-flex flex-column" id="categoryListContainer">
                    <!-- Categories will be rendered by JS -->
                </div>
            </div>
        </aside>
        <!-- Center Column: Product Grid -->
        <section class="flex-grow-1 d-flex flex-column gap-3">
            <div class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm border">
                <h2 class="fw-bold fs-5 text-dark mb-0" id="currentCategoryTitle">Chọn Linh Kiện</h2>
                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm border text-muted" id="sortSelect">
                        <option value="basePrice,asc">Giá: Thấp đến Cao</option>
                        <option value="basePrice,desc">Giá: Cao xuống Thấp</option>
                    </select>
                </div>
            </div>
            
            <div id="loadingSpinner" class="d-none text-center py-5">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="productGridContainer">
                <!-- Product Cards will be rendered by JS -->
            </div>
            
            <!-- Pagination Container -->
            <div id="paginationContainer" class="d-flex justify-content-center mt-4">
                <!-- Pagination will be rendered by JS -->
            </div>
        </section>
        <!-- Right Column: Build Summary -->
        <aside class="flex-shrink-0" style="width: 100%; max-width: 320px;">
            <div class="bg-dark rounded shadow p-3 position-sticky mt-3" style="top: 80px;">
                <h2 class="fw-bold fs-5 text-white mb-3 border-bottom border-secondary pb-2">Tổng Quan Cấu Hình</h2>
                
                <div class="mb-4 d-flex flex-column gap-2" id="buildSummaryContainer">
                    <!-- Selected items will be rendered by JS -->
                </div>

                <div class="bg-black bg-opacity-25 rounded p-2 mb-4 border border-secondary border-opacity-50" id="compatibilityContainer">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="text-secondary fs-8">Công suất dự kiến:</span>
                        <span class="fw-bold fs-7 text-white" id="estimatedWattage">0W</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center" id="compatibilityStatus">
                        <span class="text-secondary fs-8">Độ tương thích:</span>
                        <span class="badge bg-secondary-subtle text-secondary border border-secondary d-flex align-items-center gap-1 fs-8">
                            <i class="bi bi-dash"></i> Chưa kiểm tra
                        </span>
                    </div>
                </div>
                
                <!-- Errors and Warnings from compatibility service -->
                <div id="compatibilityAlerts" class="mb-3 d-flex flex-column gap-2"></div>

                <div class="d-flex justify-content-between align-items-end mb-4">
                    <span class="fw-bold fs-6 text-secondary">Tổng tiền</span>
                    <span class="fw-bold fs-3 text-warning lh-1" id="totalPrice">0 đ</span>
                </div>

                <div class="d-flex flex-column gap-2">
                    <button id="btnAddToCart" class="btn btn-danger w-100 fw-bold py-2 d-flex align-items-center justify-content-center gap-2 shadow-sm" disabled>
                        <i class="bi bi-cart-check"></i> THÊM VÀO GIỎ HÀNG
                    </button>
                    <button class="btn btn-outline-success w-100 fw-bold py-2 d-flex align-items-center justify-content-center gap-2 d-none">
                        <i class="bi bi-file-earmark-excel"></i> TẢI FILE EXCEL CẤU HÌNH
                    </button>
                </div>
            </div>
        </aside>
    </main>
    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Build PC Logic -->
    <script src="/js/buildpc.js"></script>
</body>

</html>
