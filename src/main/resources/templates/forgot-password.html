<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}">
    <meta charset="UTF-8">
    <title>Quên mật khẩu - TechForge</title>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="bg-white rounded-3 shadow-sm border p-4" style="max-width: 420px; width: 100%;">
        <h5 class="fw-bold text-dark mb-1">Quên mật khẩu</h5>
        <p class="text-muted fs-7 mb-4">Nhập email đã đăng ký, chúng tôi sẽ gửi mã OTP xác thực.</p>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 fs-8" th:text="${errorMessage}"></div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label fs-7 fw-semibold">Email</label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       placeholder="Nhập email của bạn">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button type="submit" class="btn btn-danger w-100">Gửi mã OTP</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}" class="fs-8 text-muted text-decoration-none">
                <i class="bi bi-arrow-left"></i> Quay lại đăng nhập
            </a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
